reel: 1
title: Будущее работы — кто отвечает за результат
lang: ru
format: { preset: vertical, fps: 30 }
voice: { engine: kokoro, voice: dima, speed: 1.0 }
music: { bpm: 84, key: D, progression: [I, V, vi, IV], gain: 0.22 }
loudness: -14
theme: theme.css
data: { facts: facts.json }
captions: { show: true, maxWords: 5 }
transition: { kind: fade, dur: 0.4 }
stills:
  cover: hook@question
  process: process@review
post:
  title: Будущее работы — кто отвечает за результат
  text: |
    Внедрение ИИ начинается с устройства работы: что поручить модели, как проверить результат и кто принимает решение.

    Оценка МОТ о потенциальной затронутости примерно четверти мировой занятости — не прогноз исчезновения четверти рабочих мест. Источник: https://www.ilo.org/resource/article/how-might-generative-ai-impact-different-occupations (20 мая 2025).

    Практический подход автора: выбрать один повторяемый процесс, определить качество и ответственность, затем сравнить время работы и исправления с исходным процессом. Это рекомендация, а не измеренный результат исследования.

    Озвучка синтезирована: Kokoro-RU, голос Dima. Происхождение и условия модели указаны в CREDITS.md.
  tags: [будущееработы, ИИ, управление, продуктивность, бизнес]
scenes:
  - id: hook
    scene: headline
    say: >-
      Работа меняется. Ответственность остаётся. {#answer}Искусственный интеллект готовит ответ.
      {#question}Кто проверяет результат?
    pad: [0.2, 0.65]
    energy: 0.25
    sfx: [{ at: question, kind: tick, gain: 0.4 }]
    props:
      kicker: Будущее работы
      lines:
        - { text: Кто отвечает, at: -1 }
        - { text: за результат?, at: -1, tone: blue, mark: результат }
      stamp: { text: Черновик ≠ решение, at: answer, tone: blue }
      note: { text: Проверка — часть процесса, at: question }
  - id: tasks
    scene: task-stack
    say: >-
      Возьмём аналитика. {#cut}Сбор материалов, черновик отчёта и сводку встречи можно поручить модели.
      {#human}Проверка выводов, разговор с клиентом и решение остаются отдельными задачами.
    pad: [0.25, 0.7]
    energy: 0.35
    sfx: [{ at: cut, kind: whoosh, gain: 0.35 }]
    props:
      title: Как меняется работа аналитика
      role: аналитик
      cutAt: cut
      aiLabel: модели
      tasks:
        - { text: Собрать материалы, ai: true }
        - { text: Подготовить черновик, ai: true }
        - { text: Проверить выводы }
        - { text: Сделать сводку встречи, ai: true }
        - { text: Обсудить с клиентом }
        - { text: Принять решение }
      after: { text: Ответственность остаётся, at: human, mark: Ответственность }
  - id: evidence
    scene: crowd
    say: >-
      По оценке Международной организации труда, примерно {#share}каждая четвёртая работа в мире
      потенциально затронута генеративным искусственным интеллектом. {#caveat}Это оценка возможных изменений.
      Она не означает, что каждое четвёртое место исчезнет.
    pad: [0.25, 0.7]
    energy: 0.3
    sfx: [{ at: share, kind: pop, gain: 0.35 }]
    props:
      title: Работа будет меняться
      cols: 8
      rows: 5
      groups:
        - { shareFrom: facts.ilo.share, label: потенциально затронута, at: share, tone: blue }
      value: { textFrom: facts.ilo.label, at: share }
      note: { text: 'Затронутость ≠ потеря работы', at: caveat }
      sourceFrom: facts.ilo.sourceLine
  - id: process
    scene: steps
    say: >-
      Поэтому внедрение начинается с процесса: {#task}где модель помогает, {#review}кто проверяет
      и {#decision}кто принимает решение. Ускорять выпуск черновиков без проверки — значит быстрее распространять ошибки.
    pad: [0.25, 0.7]
    energy: 0.4
    props:
      title: Спроектируйте весь процесс
      tone: blue
      items:
        - { text: Модель помогает, sub: черновик и обработка материалов, at: task }
        - { text: Человек проверяет, sub: факты и критерии качества, at: review }
        - { text: Ответственный решает, sub: контекст и последствия, at: decision }
  - id: action
    scene: steps
    say: >-
      Руководителю стоит {#choose}выбрать один повторяемый процесс, {#quality}задать критерии качества
      и назначить ответственного. {#compare}Затем сравнить время выполнения и число исправлений
      с прежним способом работы.
    pad: [0.25, 0.7]
    energy: 0.45
    sfx: [{ at: compare, kind: ding, gain: 0.35 }]
    props:
      title: Начните с одного процесса
      tone: blue
      items:
        - { text: Выберите задачу, sub: повторяемую и проверяемую, at: choose }
        - { text: Задайте качество, sub: критерии и ответственный, at: quality }
        - { text: Сравните результат, sub: время и исправления до и после, at: compare }
  - id: outro
    scene: outro
    say: >-
      Ваша ценность — понять задачу, проверить факты и принять решение.
      {#cta}Начните с одного процесса, за который вы отвечаете.
    pad: [0.25, 1.6]
    energy: 0.3
    props:
      lines:
        - { text: Контекст., at: 0.1, tone: blue }
        - { text: Проверка., at: 0.8, tone: blue }
        - { text: Решение., at: 1.5, tone: blue }
      cta: { text: Выберите свой первый процесс, at: cta }
      sign: Деловой explainer · Storygro
