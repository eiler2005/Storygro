ideas: 1
audience: Руководители, основатели и специалисты, внедряющие ИИ в работу
items:
  - id: future-of-work
    title: Будущее работы — кто отвечает за результат
    thesis: При внедрении ИИ нужно проектировать проверку и ответственность вместе с автоматизацией задач.
    status: produced
    episode: ../videos/future-of-work/episode.yaml
    sources:
      - https://www.ilo.org/resource/article/how-might-generative-ai-impact-different-occupations
      - https://www.anthropic.com/research/anthropic-economic-index-january-2026-report
    ratings: { evidence: 5, audience: 5, utility: 5, visual: 4, timeliness: 3, ease: 4 }
    rationale: 'Первый деловой выпуск по запросу владельца; исследования поддерживают изменение задач, рекомендации о процессе — авторская рамка. Оценки редакционные.'
    watch:
      wikipedia: { ru: [Технологическая_безработица], en: [Technological_unemployment] }
      hn: [future of work, reskilling]
  - id: ai-review
    title: Где проверять работу ИИ-агента
    thesis: Проверку нужно проектировать вместе с задачей агенту.
    status: produced
    episode: ../videos/ai-agent-checks/episode.yaml
    sources:
      - https://arxiv.org/abs/2406.12045
      - https://www.anthropic.com/engineering/building-effective-agents
    ratings: { evidence: 5, audience: 5, utility: 5, visual: 5, timeliness: 4, ease: 4 }
    rationale: 'Выбрано по сканированию трендов 19.10.2026: единственная идея с растущим вниманием (медиана 1.27) и прямой сигнал HN про тихие сбои агентов. Ход выбора — content/research/ai-agent-checks/README.md. Оценки редакционные; тренд — контекст, не доказательство тезиса.'
    watch:
      wikipedia: { en: [AI_agent], ru: [Искусственный_интеллект] }
      hn: [AI agent, agentic]
  - id: micro1-work-data
    title: Зачем micro1 покупает рабочие данные компаний
    thesis: Спрос на опыт рабочих процессов показывает интерес к их обучению и оценке, но сам по себе не доказывает готовую автоматизацию.
    status: produced
    episode: ../videos/micro1-work-data/episode.yaml
    sources:
      - https://www.micro1.ai/blog/micro1-commits-1b-to-enterprise-data-acquisition
      - https://www.micro1.ai/data-partnerships
    ratings: { evidence: 5, audience: 5, utility: 5, visual: 5, timeliness: 5, ease: 4 }
    rationale: 'Выбрано владельцем по присланному посту; заявления проверены по micro1. Компания — первичный источник о своей программе, не независимое подтверждение исполнения бюджета. Оценки редакционные.'
    watch:
      wikipedia: { en: ['Training,_validation,_and_test_data_sets', Labeled_data] }
      hn: [training data, data labeling]
  - id: junior-training
    title: Как обучать новичков, когда черновик пишет нейросеть
    thesis: Практику нужно организовать вокруг объяснения и проверки решений, сохраняя задачи для обучения.
    status: candidate
    sources:
      - https://www.ilo.org/publications/generative-ai-and-jobs-2025-update
    ratings: { evidence: 3, audience: 5, utility: 4, visual: 4, timeliness: 3, ease: 4 }
    rationale: Продолжение ai-jobs; нужны исследования обучения, чтобы отделить методику от рабочей гипотезы автора.
    watch:
      wikipedia: { ru: [Стажировка], en: [Entry-level_job] }
      hn: [junior developers, entry-level]
  - id: content-from-source
    title: Как превратить исследование в несколько материалов
    thesis: Один набор проверенных источников связывает видео, карусель и текст поста.
    status: candidate
    sources:
      - https://github.com/eiler2005/Storygro
    ratings: { evidence: 5, audience: 4, utility: 4, visual: 5, timeliness: 2, ease: 5 }
    rationale: Демонстрация уже работающих сценариев Storygro; без обещаний автоматического роста или публикации.
  - id: slidecraft-demo
    title: Презентация из одного промпта — демо SlideCraft
    thesis: Запись настоящего экрана объясняет продукт быстрее, чем пересказ возможностей.
    status: produced
    episode: ../videos/slidecraft-demo/episode.yaml
    sources:
      - https://github.com/eiler2005/slidecraft
    ratings: { evidence: 5, audience: 3, utility: 4, visual: 5, timeliness: 2, ease: 4 }
    rationale: 'Первый ролик серии product-demos; проверка конвейера storygro capture → screencast на реальном сайте. Продуктовое демо, не независимый обзор.'
