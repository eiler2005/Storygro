series: 1
id: football-legends
title: Маленькие большие дела · Легенды футбола
audience: Дети 6–10 лет и их родители, русскоязычные
format: >-
  Вертикальный Reels 1,5–2 мин о первых пятнадцати разных обладателях «Золотого мяча» (1956–1971): ведущие
  енот Матвей (6) и белочка София (8) знакомятся с легендой. Общий титул, имя футболиста, проверенное прозвище
  или отличительная черта с узнаваемой визуальной шуткой и знак награды на самом первом кадре,
  сразу голосовой хук, переход к истории без отдельной паузы-заставки, карточка игрока, одна
  главная история с финтом, голом или сейвом, факт и вопрос зрителю. Премиальная стилизованная 3D-картинка
  GPT Image (Codex) с эталонами ведущих (images.refs), палитра тёмно-синий/золото/газон/кремовый, рассказчик
  OmniVoice B 0,90; тексты — от владельца, дословно, кроме явно разрешённых экспериментов с удержанием;
  общие scene series-cover и football-legends.css, отдельная историческая атмосфера каждого выпуска;
  встроенный GPT Image (точная версия инструментом не раскрывается); библия — football-legends.md.
  Стандарт Reels 29.10.2026: полный 1080×1920/30 fps без полей, safe reels, подписи до четырёх слов;
  создание через new --target instagram-reels, рецепт — docs/how-to/instagram-without-cropping.md.
  Правило владельца 31.10.2026: до производства заполнить DIRECTION.md по исследованию удержания;
  действие под полным титулом, ранний результат, причинная история и ответ на хук.
  Следующий выпуск — пилот FL-R1 из content/research/reels-growth-2026-10-31/experiments.yaml;
  длительность, голос и подход к финалу сохраняются; сокращение — отдельный будущий тест.
  Сам футболист вместе с ведущими виден с первого кадра. По правилу владельца31.10.2026
  включать реальные фото игрока и стадиона с проверенными правами, датой и авторством;
  отдельные карточки archive-photo, происхождение и SHA-256 в photos.json; поздние фото явно датировать.
  Кадр предназначен детям: авторы, никнеймы, лицензии и технические данные — только в описании/документации;
  в фотокарточке название и краткая дата, без creditFrom и проверочных направляющих в экспорте.
  Исключение по просмотру владельца: выпуск9 V2 замедлен до OmniVoice B 0.82/off,
  дольше удерживает результаты; длительность и скорость уже не контролируются в FL-R1.
  После V2 владелец закрепил для новых/переделываемых выпусков спокойную речь,
  время на рассматривание фото и паузу после важного результата (ориентир проверки 1–2 с).
  Сложные слова проверять в контексте и слушать в итоговой реплике; ASR не заменяет слух.
  V2 Эусебио — рабочий образец темпа, без автоматической замены настроек других выпусков.
  Футболисты — главные герои изображения и истории; Матвей/София рядом в поддерживающей роли.
  Проверять узнаваемость лица в заставке и ключевых сценах, не подменять игрока упражнениями ведущих.
  31.10.2026: основа — подробный мультфильм с узнаваемым футболистом и несколькими связанными
  действиями/ракурсами. Ведущие меньше рядом. Всего 1–3 фото-вставки; большая часть времени — рисунки.
  Два современных фото-выпуска не образец дальнейшего стиля; не подменять мультфильм фотоисторией.
