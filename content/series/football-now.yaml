series: 1
id: football-now
title: Маленькие большие дела · Легенды футбола · Наши современники
audience: Дети 6–10 лет и их родители
format: >-
  Современные спецвыпуски между историческими «Легендами футбола», без замены их нумерации.
  Те же Матвей и София, общие два названия, золотой символ и имена на первом кадре.
  Футболисты — главные визуальные и сюжетные герои; ведущие меньше и рядом, помогают понять игру.
  Правдоподобное проверенное сходство, настоящие лицензированные фото и датированные источники;
  техническая атрибуция только в описании и документах, без AI-ретуши реальных лиц.
  1080×1920/30, полный фон, safe reels, обложка в центральном квадрате;
  спокойный OmniVoice B 0.82/off и паузы после важных результатов.
  DIRECTION.md, причинная история, честная развязка и один пилот без обещания просмотров.
  В первых двух роликах новые лица генератор отклонил: игроки показаны настоящими фотографиями,
  встроенный GPT Image создаёт только оригинальных вымышленных ведущих и среду.
cadence: По запросу владельца, чередуя с исторической серией
episodes:
