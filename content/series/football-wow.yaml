series: 1
id: football-wow
title: Маленькие большие дела · ФУТБОЛЬНЫЙ ВАУ-ФАКТ!
audience: Дети 6–10 лет и родители
format: >-
  Короткая рисованная история примерно на 25 секунд по одному проверенному факту.
  Футболист главный, Матвей и София рядом. Детальный мультфильм составляет основу;
  1–3 реальные фото-вставки максимум за весь ролик, без фотокарточек как основного монтажа.
  Несколько связанных состояний действия, разные ракурсы, эпоха, форма, узнаваемое лицо,
  собственные свет/палитра/юмор каждого выпуска. Встроенный GPT Image, без текста в рисунках.
  Речь сразу, спокойный голос; сокращать формулировки вместо ускорения. Полный 1080×1920/30.
  Собственная компактная идентичность, имя и факт на первом кадре внутри центрального квадрата.
cadence: По запросу владельца; собраны версии для просмотра Пеле и Златана, остальные по отдельному заказу
