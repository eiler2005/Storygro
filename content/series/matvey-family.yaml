series: 1
id: matvey-family
title: Семья Матвея
audience: Дети 5–8 лет и их родители, русскоязычные
format: >-
  Вертикальный мультик около 2 минут для Instagram: сказочная история семьи зверят — енот Матвей (6),
  белочка София (8), мама-лиса Марина, папа-леопард Денис. Одна жизненная ситуация и вывод, который ребёнок
  может обсудить с родителями. Детальные рисованные картинки GPT Image (Codex), постоянный каст в images.cast,
  рассказчик OmniVoice B 0,90; сценарии — от владельца. Новые и пересобираемые Reels следуют стандарту
  29.10.2026: полный 1080×1920/30 fps без полей, safe reels, подписи до четырёх слов;
  new --target instagram-reels, рецепт — docs/how-to/instagram-without-cropping.md.
cadence: по запросу владельца
episodes:
  - ../videos/matvey-mimo-vorot/episode.yaml
