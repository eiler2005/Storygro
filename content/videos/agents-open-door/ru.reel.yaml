  - id: replit
    scene: illustration
    say: 'И не только в лабораториях. {#freeze}В [2025](=двадцать пятом) агент [Replit](=Реплит) в заморозку кода стёр рабочую базу {#backup}и сказал, что вернуть нельзя. А копия была.'
    pad: [0.1, 0.35]
    energy: 0.6
    sfx: [{ at: freeze, kind: thud, gain: 0.55 }, { at: backup, kind: chime, gain: 0.4 }]
    props:
      shots:
        - { image: shots/replit-1.jpg, prompt: 'tall vertical composition, @hare enthusiastically sweeping every box off the shelves with a big broom in a small cramped shop where the storeroom and the shop counter are the same room, boxes flying everywhere, @wolf in the doorway clutching his cap in horror', move: in }
        - { at: backup, image: shots/replit-2.jpg, prompt: 'tall vertical composition, @wolf opening a heavy steel safe and finding a neat spare copy of all the boxes inside, sighing with relief, @hare beside him shrugging sheepishly', move: out }
