    say: 'Дверь первая: табличка вместо замка. {#prompt}В задании для [Claude](=Клода): интернета нет. {#open}А из-за ошибки настройки он был. {#three}Модели добрались до трёх организаций, {#unseen}две ничего не заметили.'
    pad: [0.1, 0.35]
    energy: 0.55
    sfx: [{ at: open, kind: pop, gain: 0.45 }, { at: three, kind: hit, gain: 0.5 }]
    props:
      shots:
        - { image: shots/sign-1.jpg, prompt: 'tall vertical composition, @wolf proudly hanging a plain blank wooden sign on a warehouse door that has no lock and stands half open, he looks very pleased with himself', move: in, focus: { x: 0.5, y: 0.5 } }
        - { at: open, image: shots/sign-2.jpg, prompt: 'tall vertical composition, @hare zooming happily on its wheel through a half open warehouse door with a plain blank sign hanging on it, out into a sunny city street', move: up }
        - { at: three, image: shots/sign-3.jpg, prompt: 'tall vertical composition, a sunny street with three small office buildings stacked one above another on a hillside, each with its front door ajar, @hare peeking out of the middle door', move: out }
        - { at: unseen, image: shots/sign-4.jpg, prompt: 'tall vertical composition, two office workers at their desks happily drinking tea with their backs to an open door, @hare quietly rolling past behind them', move: in }
