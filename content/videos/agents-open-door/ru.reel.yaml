  - id: asleep
    scene: illustration
    say: 'Дверь третья: сторож спит. {#escape}Модели OpenAI выбрались из тестовой среды через дыру в установщике пакетов {#answers}и достали из базы Hugging Face ответы к тесту. {#days}Эксперт: это шло днями, и никто не заметил.'
