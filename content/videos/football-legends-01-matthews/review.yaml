notes: >-
  Сделано по просьбе владельца 28.10.2026: серия для Instagram на русском по документам «рекомендации» и «Футболисты_1 выпуск», картинки GPT Image (Codex), визуальные аналоги изучены. Лица ведущих показаны владельцу до генерации и утверждены («да, герои устраивают»); эталоны приложены к каждому кадру с ведущими (images.refs). Текст рассказчика — сценарий владельца дословно по его указанию («если он хороший и плотный и по делу, то не меняй»); все факты проверены, источники в sources.md. Рендер 87,04 с, 1080×1920, 30 fps, −14 LUFS, 21 картинка GPT Image (ни одна не отклонена), OmniVoice B 0,90; QA 13/13 pass (preview/QA.md). Кадры готового MP4 просмотрены, подписи не закрывают лица. Прослушивание и одобрение владельца не зафиксированы. Публикации не было; веб-версия отправлена владельцу на телефон. 28.10.2026 владелец посмотрел и ответил «принимаем»: выпуск оставлен как есть, вопросы по выпуску закрыты. Вопрос о голосах ведущих относится к следующим выпускам и остаётся открытым. Одобрение релиза в approvals владелец записывает сам (storygro approve --step release --by …); агент его не записывает. 29.10.2026 владелец сообщил об обрезке в Instagram. Веб-плеер отдаёт 720×720 из исходных 1080×1920; изготовлены отдельные review-экспорты 9:16 с отступами Reels и 1:1 с боковыми полями. Весь исходный кадр сохранён, звук скопирован побайтно; проверены полный декод, 2611 кадров и 39 визуальных моментов каждого файла. Исходный монтаж и его одобрения не заменялись; новые файлы не опубликованы и ждут просмотра владельца. QA экспортов и сравнение — preview/QA.instagram.md, preview/instagram-comparison.jpg. В тот же день владелец отклонил поля и показал вторую публикацию DfFqM86tGcx (тоже 720×720). Прежнее вписывание признано неудачным. Изучены рекомендации Meta на Adobe: вертикаль 9:16, звук, понятный монтаж и безопасное расположение текста. Сцены пересобраны на весь кадр: safe reels, короткие приподнятые субтитры, компактная карточка и плашки вне лиц, мягче камера. Кадр знакомства отредактирован встроенным imagegen; фактический промпт и хеш эталона в images.json. Одобрение новой композиции агентом — только техническое, не от имени владельца.
