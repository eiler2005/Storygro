# «Альфредо Ди Стефано» — выпуск 2 рубрики «Легенды футбола» проекта «Маленькие большие дела»: ведущие енот
# Матвей (6) и белочка София (8) знакомятся с обладателями «Золотого мяча». Для детей 6–10 лет и родителей,
# 9:16 для Instagram Reels по стандарту репозитория (ADR 0007): полный кадр, текст ниже линии ленты 4:5,
# головы ниже верхней пятой части кадра, загрузка как Reels с «Оригиналом». Текст рассказчика — сценарий
# владельца дословно (факты проверены, sources.md); строка «Official website Real Madrid C.F.+1» — остаток
# ссылки, не озвучивается; пометка «Вопрос зрителю:» не читается, как в первом выпуске. Числа для голоса
# словами, на экране — цифрами из facts.json. Шапка (голос, музыка, ведущие и эталоны, тема) — из выпуска 1.
reel: 1
style: cartoon
title: 'Альфредо Ди Стефано'
lang: ru
format: { preset: vertical, width: 1080, height: 1920, fps: 30 }
safe: reels
voice:
  engine: omnivoice
  model: k2-fsa/OmniVoice
  voice: assets/voice/narrator-ru.wav
  speed: 0.9
  # marks: only the author's `+` reach OmniVoice (as an uppercase vowel); unmarked words read as with off
  stress: marks
music: { bpm: 104, key: D, progression: [I, V, vi, IV], gain: 0.12, drop: cups#years }
loudness: -14
theme: theme.css
captions: { show: true, maxWords: 4 }
transition: { kind: fade, dur: 0.3 }
data: { facts: facts.json }
stills: { cover: hook@0, final: cups@team, hosts: question@1.5 }
images:
  # GPT Image through the Codex CLI; the 3D look and palette from the owner's brief, Reels composition
  provider: codex
  model: gpt-6-astra
  seed: 57
  width: 1088
  height: 1920
  prompt: >-
    Premium stylized 3D family animation film still with the polish of a modern feature-animation studio,
    not photorealistic and not babyish: expressive faces, beautifully detailed soft fur and fabric,
    cinematic warm light, a rich detailed background, a palette of deep navy blue, warm gold, lush pitch
    green and cream white with restrained orange and plum accents. Full-frame vertical 9:16 composition,
    edge-to-edge background, no borders or letterboxing. The top fifth of the frame is calm sky, stands or
    background with no heads, faces, hands or ball; every head and face sits between one fifth and two
    thirds of the height, away from the side edges; the bottom quarter is simple grass, floor or crowd
    seen from behind, without faces. {subject}. No text, no letters, no numbers, no logos, no crests, no
    flags, no watermark, no extra limbs, no duplicate characters.
  cast:
    matvey: >-
      Matvey (a small six-year-old anthropomorphic raccoon boy with soft grey-brown fur, a dark eye mask, a
      white muzzle, big lively dark-brown eyes, round ears with white edges and a fluffy tail with dark
      rings, wearing a plain royal-blue football kit with white collar trim, blue-and-white striped socks
      and blue-and-white boots)
    sofia: >-
      Sofia (his sister, an eight-year-old anthropomorphic red squirrel girl, a little taller than Matvey,
      with a round childlike face, chestnut-orange fur, a cream muzzle, tufted ears, big warm amber eyes, a
      short high ponytail with a plum hair band and a large fluffy curled tail, wearing a plain plum-purple
      zip tracksuit with thin white stripes and white-and-lilac trainers)
    distefano: >-
      Alfredo Di Stéfano (the Argentine-born Spanish footballer of the 1950s as a respectful, recognisable
      stylized 3D caricature: a lean, athletic man of about thirty with a long face, a high forehead with
      thinning light-brown hair combed back, strong dark eyebrows, a strong nose and an intense, focused
      look, wearing a plain all-white 1950s football kit with a white collar, long white shorts, white
      socks and old brown leather boots)
    distefano-spain: >-
      Alfredo Di Stéfano (the same lean man with a long face, a high forehead and thinning light-brown hair
      combed back, strong dark eyebrows and a strong nose, wearing a plain red 1950s football shirt with a
      collar, dark blue shorts and black socks)
    madrid: >-
      his teammates (1950s footballers in plain all-white kits with long white shorts)
    rivals: >-
      opponents (1950s footballers in plain dark red shirts and black shorts)
  # reference pictures of the hosts, approved by the owner on 2026-10-28 (content/series/football-legends/cast/)
  refs:
    matvey: [../../series/football-legends/cast/matvey-face.png, ../../series/football-legends/cast/hosts-full.png]
    sofia: [../../series/football-legends/cast/sofia-face.png, ../../series/football-legends/cast/hosts-full.png]
post:
  title: 'Легенды футбола · Альфредо Ди Стефано — футболист, который успевал везде'
  text: |
    Как думаешь, что полезнее для команды: забивать самому или уметь помогать всем игрокам? Енот Матвей и белочка София знакомятся с Альфредо Ди Стефано — он родился в Буэнос-Айресе, играл за сборную Испании, дважды получил «Золотой мяч» (1957 и 1959) и вместе с «Реалом» выиграл пять Кубков европейских чемпионов подряд (1956–1960).

    Выпуск 2 рубрики «Легенды футбола» проекта «Маленькие большие дела». Источники: UEFA.com, Wikipedia. Картинки нарисованы GPT Image — это дружеские шаржи, а не фотографии; ролик не связан с футболистом, клубами и организаторами награды. Голос рассказчика синтетический (OmniVoice).
  tags: [футбол, детям, легендыфутбола, золотоймяч, дистефано, реалмадрид, историяфутбола]
scenes:
  # хук: игрок, который успевает везде; первый кадр — обложка
  - id: hook
    scene: illustration
    say: 'Представьте футболиста, который не просто забивает г+олы, а участвует почти в каждой важной атаке команды. {#own}Он может начать атаку возле своих ворот, {#pass}отдать передачу, побежать впер+ёд — {#goal}и через несколько секунд уже оказаться у чужих ворот!'
    pad: [0.15, 0.35]
    energy: 0.6
    transition: { kind: cut, dur: 0 }
    sfx: [{ at: start, kind: swell, gain: 0.25 }, { at: own, kind: pop, gain: 0.25 }, { at: goal, kind: whoosh, gain: 0.35 }]
    props:
      shots:
        - { image: shots/hook.jpg, prompt: '@matvey and @sofia on a modern green football pitch at golden hour: Matvey holds up an old sepia football trading card with a portrait of @distefano, staring at it with huge excited eyes; @sofia kneels beside him and traces a long dotted white chalk line on the grass that runs from one goal far behind them towards the other, explaining with a clever smile; a modern stadium softly blurred behind, floodlights starting to glow', move: in, zoom: 0.035, focus: { x: 0.5, y: 0.55 } }
        - { at: own, image: shots/hook-2.jpg, prompt: 'a 1950s match in a packed old stadium: @distefano wins the old leather ball in front of his own penalty area, right next to his own goal and his goalkeeper, already looking up the pitch to start an attack; @rivals around him; warm sepia-tinted vintage grading with subtle film grain', move: in, zoom: 0.035, focus: { x: 0.5, y: 0.58 } }
        - { at: pass, image: shots/hook-3.jpg, prompt: '@distefano at the halfway line plays a long pass with the old leather ball to a teammate from @madrid and immediately sprints forward past a surprised opponent from @rivals, motion lines behind him; a packed 1950s stadium; warm sepia-tinted vintage grading with subtle film grain', move: right, zoom: 0.035, focus: { x: 0.5, y: 0.58 } }
        - { at: goal, image: shots/hook-4.jpg, prompt: 'seconds later @distefano is already in front of the opponents'' goal at the other end of the pitch, shooting the old leather ball past a diving goalkeeper in a dark kit into the net, the 1950s crowd behind the goal rising; warm sepia-tinted vintage grading with subtle film grain', move: in, zoom: 0.035, focus: { x: 0.5, y: 0.6 } }

  # микрозаставка рубрики: тот же кадр, что в выпуске 1, без слов
  - id: intro
    scene: illustration
    say: ''
    min: 2.2
    energy: 0.7
    transition: { kind: cut, dur: 0 }
    sfx: [{ at: start, kind: hit, gain: 0.3 }, { at: 0.5, kind: chime, gain: 0.4 }]
    props:
      shots:
        # the series intro picture of episode 1, copied; its prompt and checksum are in images.json
        - { image: shots/intro.jpg, move: in, zoom: 0.02, focus: { x: 0.5, y: 0.58 } }
      title: { textFrom: facts.series.title, at: 0.15, size: 0.046 }
      labels:
        - { textFrom: facts.series.project, x: 0.46, y: 0.275, at: 0.3, tone: plum }

  # карточка игрока: кто он и откуда
  - id: card
    scene: illustration
    say: 'Так играл Альфредо Ди Ст+ефано. {#born}Он родился в аргентинском Бу+энос-Айресе, {#spain}а позднее выступал за сборную Испании. {#real}Но особенно прославился в мадридском «Реале».'
    pad: [0.2, 0.35]
    energy: 0.5
    props:
      shots:
        - { image: shots/card.jpg, prompt: '@distefano kneels on one knee on a modern green pitch at golden hour between @matvey and @sofia, holding an old brown leather football, all three smiling warmly at one another; their three heads close together in the upper middle of the frame; a modern stadium softly blurred behind; the lower part of the frame simple green grass', move: in, zoom: 0.03, focus: { x: 0.5, y: 0.15 } }
        - { at: born, image: shots/card-2.jpg, prompt: 'a sunny 1930s street in an old neighbourhood of Buenos Aires: colourful low houses with balconies, cobblestones, a tram in the distance; a boy of about ten in a white shirt and shorts kicks a worn leather ball against a wall while other children watch; warm nostalgic vintage colours', move: right, zoom: 0.035, focus: { x: 0.5, y: 0.6 } }
        - { at: spain, image: shots/card-3.jpg, prompt: '@distefano-spain dribbles the old leather ball forward in a late-1950s international match in a full stadium, an opponent in a plain white shirt chasing him; warm vintage colour grading with subtle film grain', move: in, zoom: 0.035, focus: { x: 0.5, y: 0.6 } }
        - { at: real, image: shots/card-4.jpg, prompt: '@distefano in his all-white kit raises his arms in celebration in front of a huge, packed 1950s stadium at night under the floodlights, the white-clad crowd cheering; @madrid running towards him; warm vintage colour grading with subtle film grain', move: out, zoom: 0.035, focus: { x: 0.5, y: 0.55 } }
      portrait:
        image: shots/portrait.jpg
        until: born
        prompt: 'a tight head-and-shoulders close-up portrait of @distefano that fills the whole frame: his face large in the upper middle of the frame, the collar of his white shirt at the bottom edge, looking slightly to the side with a calm, confident half-smile, a plain warm cream background, soft studio light, the look of a 1950s collectible football card; no body below the chest'
        at: 0.25
        y: 0.475
        height: 0.16
        compact: true
        nameFrom: facts.player.name
        countryFrom: facts.player.country
        valueFrom: facts.player.years
        labelFrom: facts.player.label
      labels:
        - { textFrom: facts.born.city, x: 0.5, y: 0.24, at: born, until: spain, tone: accent }
        - { textFrom: facts.born.spain, x: 0.5, y: 0.24, at: spain, until: real, tone: navy }
        - { textFrom: facts.born.club, x: 0.5, y: 0.24, at: real, tone: navy }

  # главный факт: два «Золотых мяча»
  - id: award
    scene: illustration
    say: 'Ди Ст+ефано был настолько хорош, что получил «Золотой мяч» дважды: {#first}в [1957](=тысяча девятьсот пятьдесят седьмом) {#second}и [1959](=тысяча девятьсот пятьдесят девятом) годах. {#twice}Это важно: он не просто один раз стал лучшим в Европе, а сумел повторить успех.'
    pad: [0.2, 0.4]
    energy: 0.65
    sfx: [{ at: first, kind: ding, gain: 0.35 }, { at: second, kind: ding, gain: 0.35 }, { at: twice, kind: chime, gain: 0.4 }]
    props:
      shots:
        - { image: shots/award-1.jpg, prompt: '@distefano in an elegant 1950s dark suit and tie holds up a luminous golden football-shaped trophy on a small stage, smiling modestly, photographers with old flash cameras around him, warm golden light; warm vintage colour grading with subtle film grain', move: in, zoom: 0.035, focus: { x: 0.5, y: 0.5 } }
        - { at: twice, image: shots/award-2.jpg, prompt: '@matvey and @sofia on a modern pitch at golden hour stand beside two identical luminous golden football-shaped trophies on dark plinths; Sofia proudly shows two fingers, Matvey looks from one trophy to the other with his mouth open in amazement', move: out, zoom: 0.035, focus: { x: 0.5, y: 0.55 } }
      badge: { valueFrom: facts.award.count, labelFrom: facts.award.label, at: 0.3, until: twice, side: left, y: 0.02, size: 0.085 }
      labels:
        - { textFrom: facts.award.first, x: 0.72, y: 0.2, at: first, until: twice, tone: accent }
        - { textFrom: facts.award.second, x: 0.72, y: 0.255, at: second, until: twice, tone: accent }

  # пять Кубков чемпионов подряд
  - id: cups
    scene: illustration
    say: 'Вместе с ним «Реал Мадрид» выиграл пять Кубков европейских чемпионов подряд — {#years}с [1956](=тысяча девятьсот пятьдесят шестого) по [1960](=тысяча девятьсот шестидесятый) год. {#team}Это была невероятная команда, а Ди Ст+ефано стал одним из её главных героев.'
    pad: [0.2, 0.6]
    energy: 0.9
    sfx: [{ at: years, kind: riser, gain: 0.3 }, { at: team, kind: chime, gain: 0.5 }, { at: team, kind: swell, gain: 0.3 }]
    props:
      shots:
        - { image: shots/cups-1.jpg, prompt: 'a row of five identical large shining silver trophy cups with big handles standing side by side on a long wooden table in an old trophy room, warm light from a window; @matvey and @sofia stand behind the right half of the table and lean in to look at the cups with wide eyes, their heads between one third and one half of the frame height; the upper left quarter shows only calm wooden shelves and the window, with no heads; warm colours', move: right, zoom: 0.035, focus: { x: 0.5, y: 0.55 } }
        - { at: team, image: shots/cups-2.jpg, prompt: '@madrid lift @distefano onto their shoulders, he holds up a large shining silver trophy cup with big handles, all of them laughing in a packed 1950s stadium at night under floodlights, confetti in the air; the crowd behind them cheering; the bottom quarter of the frame shows only grass and the backs of photographers; warm vintage colour grading turning brighter', move: out, zoom: 0.035, focus: { x: 0.5, y: 0.55 } }
      badge: { valueFrom: facts.cups.count, labelFrom: facts.cups.label, at: 0.3, until: team, side: left, y: 0.02, size: 0.07 }
      labels:
        - { textFrom: facts.cups.years, x: 0.5, y: 0.6, at: years, until: team, tone: accent }

  # мастерство в действии: универсальность
  - id: skill
    scene: illustration
    say: 'Его особенность заключалась в универсальности. {#def}Он помогал обороняться, {#build}строил атаки, {#pass}отдавал передачи {#score}и сам забивал.'
    pad: [0.2, 0.25]
    energy: 0.7
    sfx: [{ at: def, kind: pop, gain: 0.3 }, { at: build, kind: pop, gain: 0.3 }, { at: pass, kind: whoosh, gain: 0.3 }, { at: score, kind: hit, gain: 0.35 }]
    props:
      shots:
        - { image: shots/skill-1.jpg, prompt: '@distefano stands in the middle of an old 1950s pitch with the old leather ball at his feet, head up, scanning the whole field like a conductor, teammates from @madrid and @rivals around him; a full stadium; warm sepia-tinted vintage grading with subtle film grain', move: in, zoom: 0.03, focus: { x: 0.5, y: 0.55 } }
        - { at: def, image: shots/skill-2.jpg, prompt: '@distefano sprints back to defend near his own goal and slides in to take the old leather ball cleanly from an attacker from @rivals; a 1950s stadium; warm sepia-tinted vintage grading with subtle film grain', move: left, zoom: 0.035, focus: { x: 0.5, y: 0.6 } }
        - { at: build, image: shots/skill-3.jpg, prompt: '@distefano carries the old leather ball forward through midfield with his head up, pointing with one arm to show a teammate from @madrid where to run; a 1950s stadium; warm sepia-tinted vintage grading with subtle film grain', move: right, zoom: 0.035, focus: { x: 0.5, y: 0.6 } }
        - { at: pass, image: shots/skill-4.jpg, prompt: '@distefano plays a precise pass with the inside of his boot, the old leather ball rolling along a curved dotted path to a teammate from @madrid who is running free; a 1950s stadium; warm sepia-tinted vintage grading with subtle film grain', move: in, zoom: 0.035, focus: { x: 0.5, y: 0.6 } }
        - { at: score, image: shots/skill-5.jpg, prompt: '@distefano heads the old leather ball powerfully into the net past a goalkeeper in a dark kit, the crowd behind the goal leaping up; a 1950s stadium; warm sepia-tinted vintage grading with subtle film grain', move: in, zoom: 0.035, focus: { x: 0.5, y: 0.6 } }
      title: { textFrom: facts.skill.title, at: 0.15, until: def, size: 0.046 }

  # продолжение той же реплики владельца: отдельная сцена, чтобы слова выровнялись по времени
  - id: create
    scene: illustration
    say: 'Ди Ст+ефано не ждал, пока команда создаст для него момент. Он сам помогал этот момент создать.'
    pad: [0.1, 0.5]
    energy: 0.6
    transition: { kind: cut, dur: 0 }
    props:
      shots:
        - { image: shots/skill-6.jpg, prompt: '@sofia stands beside a dark green chalkboard on an easel on a modern pitch at golden hour; the board shows simple white chalk arrows and circles of a team moving together (no writing at all); she points at the arrows while @matvey, holding a black-and-white football, follows them with wide eyes', move: in, zoom: 0.03, focus: { x: 0.5, y: 0.55 } }

  # вопрос зрителю
  - id: question
    scene: illustration
    say: '{#q}Как думаешь, что полезнее для команды: забивать самому или уметь помогать всем игрокам?'
    pad: [0.25, 1.6]
    energy: 0.5
    transition: { kind: fade, dur: 0.35 }
    sfx: [{ at: q, kind: chime, gain: 0.3 }]
    props:
      shots:
        - { image: shots/question.jpg, prompt: '@matvey and @sofia on a modern pitch at sunset, both thinking: Matvey holds a black-and-white football and looks towards a goal, one paw on his chin; Sofia taps her cheek thoughtfully and looks at the viewer; the luminous golden football-shaped trophy glows on its plinth far behind them, warm golden-hour stadium lights', move: in, zoom: 0.03, focus: { x: 0.5, y: 0.55 } }
      title: { textFrom: facts.question.text, at: q, size: 0.036 }

  # ответ и финал
  - id: answer
    scene: illustration
    say: 'Наверное, лучший ответ — {#both}и то и другое. {#legend}Именно поэтому Ди Ст+ефано стал легендой.'
    pad: [0.2, 1.4]
    energy: 0.7
    sfx: [{ at: both, kind: pop, gain: 0.3 }, { at: legend, kind: swell, gain: 0.35 }]
    props:
      shots:
        - { image: shots/answer.jpg, prompt: '@distefano in his all-white kit, @matvey and @sofia on a modern green pitch at golden hour pass a black-and-white football between them in a little triangle, all three laughing, Matvey about to shoot towards a goal; a modern stadium softly blurred behind', move: in, zoom: 0.03, focus: { x: 0.5, y: 0.55 } }
      # right: Di Stéfano's head is on the left
      title: { textFrom: facts.answer.text, at: both, size: 0.046, align: right, width: 0.6 }
