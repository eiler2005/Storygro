notes: "Запрос владельца 30.10.2026: выпуск 3 про Раймона Копа с прежними героями и визуальными экспериментами
  для Instagram. Рассказчик сохраняет слова сценария; удалены только копировальная строка «Site Officiel+1» и
  служебные метки разделов. Инсценировки финтов иллюстративны; 13 голов принадлежат Фонтену, не Копа. Вирусный
  охват не обещается. Одобрения агента только технические. Имена проверены пробами: обычное Копа/Коп+а
  сохраняло полный о в 8 из 8 дублей; фонетическая запись Кап+а изменила чтение на k a p a в 4 из 4. Фонт+ен
  прошёл критерий редукции в 3 из 4 дублей. Эпизод использует stress marks с явными подсказками, общая базовая
  голосовая настройка не менялась. Рендер 84.37 с, 15/15 QA pass; полный декод обоих MP4 по 2530 кадров;
  просмотрены 37 моментов MP4. Кропы ленты/обложки проверены. Фонемная модель оставила 3 неясных слова,
  требуется слух владельца. Ролик не опубликован."
