post:
  title: Легенды футбола · Раймон Копа — мастер обводки
  text: >-
    Обвести соперника или отдать пас? Матвей и София знакомятся с Раймоном Копа — первым французским
    обладателем «Золотого мяча» (1958). Его техника впечатляла, а умение вовремя поделиться мячом помогало
    команде.


    Выбери свой вариант: ОБВОДКА или ПАС — и объясни почему.


    Выпуск 3 рубрики «Легенды футбола» проекта «Маленькие большие дела». Источники: UEFA, Fédération Française
    de Football, Real Madrid, FIFA. Иллюстрации созданы с помощью GPT Image; это дружеские шаржи, а не
    документальная съёмка матчей. Голос рассказчика синтетический (OmniVoice). Ролик не связан с футболистами,
    клубами и организаторами награды.
  tags:
    - футбол
    - детям
    - легендыфутбола
    - копа
    - золотоймяч
    - реалмадрид
