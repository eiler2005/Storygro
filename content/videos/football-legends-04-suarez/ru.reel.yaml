post:
  title: Легенды футбола · Луис Суарес Мирамонтес
  text: >-
    Футбольный архитектор строит атаки. Матвей и София знакомятся с Луисом Суаресом Мирамонтесом — испанским
    полузащитником, обладателем «Золотого мяча» 1960 года. Это другой футболист, не современный уругвайский
    нападающий.


    Что замечаешь первым: МЯЧ или СВОБОДНОГО ТОВАРИЩА?


    Выпуск 4 рубрики «Легенды футбола» проекта «Маленькие большие дела». Источники: UEFA, FC Barcelona, Inter.
    Иллюстрации созданы с помощью GPT Image по архивным визуальным ориентирам; игровые эпизоды условные, это
    не запись исторических матчей. Голос рассказчика синтетический (OmniVoice). Ролик не связан с
    футболистами, клубами или организаторами награды.
  tags:
    - футбол
    - детям
    - легендыфутбола
    - луиссуарес
    - барселона
    - интер
    - золотоймяч
