post:
  title: Легенды футбола · Омар Сивори
  text: >-
    Крупнее — не значит непобедимее. Матвей и София знакомятся с Омаром Сивори, первым обладателем «Золотого
    мяча» в истории «Ювентуса» (1961). Ловкость, смелость и быстрая мысль помогали ему находить выход из
    тесноты.


    А ты чем обыграл бы большого защитника?


    Выпуск 5 рубрики «Легенды футбола» проекта «Маленькие большие дела». Источники: Juventus, UEFA,
    MuseoTorino. В исторических сценах — туринский «Комунале», домашний стадион «Ювентуса» той эпохи.
    Иллюстрации созданы с помощью GPT Image по архивным ориентирам; игровые эпизоды условные, это не
    документальная запись матчей. Голос рассказчика синтетический (OmniVoice). Ролик не связан с футболистами,
    клубами или организаторами награды.
  tags:
    - футбол
    - детям
    - легендыфутбола
    - сивори
    - ювентус
    - золотоймяч
