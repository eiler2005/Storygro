post:
  title: Легенды футбола · Йозеф Масопуст
  text: >-
    Гол в финале. Поражение. И «Золотой мяч» в том же году. Матвей и София разбираются, почему один результат
    не описывает весь вклад игрока.


    Как бы ты поддержал друга после такой игры?


    Выпуск 6 «Легенд футбола» проекта «Маленькие большие дела». Финал 1962 года: Бразилия — Чехословакия, 3:1;
    гол Масопуста на 15-й минуте. Источники: DFB, UEFA, Ballon d’Or. Исторические сцены — художественные
    иллюстрации GPT Image по архивным ориентирам, не документальная запись конкретных эпизодов. Голос
    рассказчика синтетический (OmniVoice). Не связано с футболистами, федерациями или организаторами награды.
  tags:
    - футбол
    - детям
    - легендыфутбола
    - масопуст
    - золотоймяч
    - поддержка
