post:
  title: Легенды футбола · Лев Яшин
  text: >-
    Удар в угол — успеет ли вратарь? Матвей и София знакомятся со Львом Яшиным: единственным вратарём,
    получившим «Золотой мяч» (1963). Его сила — не только реакция, но и решения, смелость и помощь защитникам.


    Что важнее для вратаря: смелость, реакция или умение предугадать удар?


    Выпуск 7 «Легенд футбола» проекта «Маленькие большие дела». Источники: Ballon d’Or, UEFA, FIFA, «Динамо»
    Москва. Иллюстрации созданы встроенным GPT Image по архивным ориентирам; игровые сцены, свет и погода
    художественные, не запись конкретного матча. Источник образа: Henk Lindeboom / Anefo, Nationaal Archief
    (CC BY-SA 3.0 NL), адаптировано в 3D-иллюстрации. Голос рассказчика синтетический (OmniVoice). Ролик не
    связан с футболистами, клубами или организаторами награды.
  tags:
    - футбол
    - детям
    - легендыфутбола
    - левяшин
    - вратарь
    - золотоймяч
