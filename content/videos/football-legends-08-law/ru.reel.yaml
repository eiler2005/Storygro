post:
  title: Легенды футбола · Денис Лоу
  text: >-
    Сильный удар или вовремя оказаться в нужном месте? Матвей и София знакомятся с Денисом Лоу — обладателем
    «Золотого мяча» 1964 года. За «Манчестер Юнайтед» он забил 237 голов в 404 матчах во всех турнирах.


    Чарльтон, Бест и Лоу: разные умения помогают одной команде. А что выбрал бы ты?


    Выпуск 8 проекта «Маленькие большие дела · Легенды футбола». Источники: France Football, Manchester
    United, Premier League, Tottenham Hotspur (воспоминания Клиффа Джонса). Иллюстрации созданы встроенным GPT
    Image; игровые действия, свет и атмосфера — художественная интерпретация, не запись конкретного матча.
    Архивный ориентир: Hugo van Gelderen / Anefo, Nationaal Archief, CC0. Голос рассказчика синтетический
    (OmniVoice).
  tags:
    - футбол
    - детям
    - легендыфутбола
    - денислоу
    - манчестерюнайтед
    - золотоймяч
