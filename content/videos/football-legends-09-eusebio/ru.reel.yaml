hooks:
  - "Ноль: три. Вы бы опустили руки? А Эусебио уже идёт в атаку."
  - Четыре гола одного игрока. Но спасут ли они команду?
  - Почему его называли «Чёрной пантерой»?
post:
  title: Легенды футбола · Эусебио
  text: >-
    0:3 — и всё потеряно? Эусебио и сборная Португалии продолжили искать шанс. В четвертьфинале чемпионата
    мира 1966 они победили Северную Корею 5:3: четыре гола забил Эусебио, пятый — его партнёр Жозе Аугушту.


    «Золотой мяч» Эусебио получил ещё в 1965 году. На чемпионате мира 1966 он стал лучшим бомбардиром с
    девятью голами, а Португалия заняла третье место.


    Если твоя команда проигрывает, что лучше: опустить руки или продолжать искать шанс?


    Выпуск 9 проекта «Маленькие большие дела · Легенды футбола». Источники: FIFA, FPF, SL Benfica, The FA.
    Форма и эпоха: Historical Football Kits; облик игрока: портрет Anefo/Nationaal Archief 1963 года, CC0.
    Иллюстрации созданы встроенным GPT Image; действия, ведущие и пантера-игрушка — художественная
    интерпретация, не запись матча. Голос рассказчика синтетический (OmniVoice).


    Реальные фото: Эусебио — Anefo / Nationaal Archief,22.10.1963,CC0
    (commons.wikimedia.org/wiki/File:Wereldelftal._Eusebio,_Bestanddeelnr_915-6597.jpg); «Гудисон Парк» —
    Simon Paul / Nsno1878,лето2003,public-domain release (commons.wikimedia.org/wiki/File:Goodisonend.jpg).
    Даты фото подписаны; поздний вид стадиона не изображает матч1966. Портрет показан с кадрированием, фото
    стадиона целиком; без AI-ретуши.
  tags:
    - футбол
    - детям
    - легендыфутбола
    - эусебио
    - португалия
    - бенфика
    - золотоймяч
