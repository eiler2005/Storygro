# «Звёзды футбола: собираем альбом» — мультик для детей 6–10 лет, около двух минут: 14 футболистов из
# списка владельца, по одному весёлому проверенному факту о каждом. Подача — альбом наклеек: точки слева
# показывают, сколько звёзд уже собрано (overlay.js), три главы — атака, середина поля, вратари.
# Футболисты на картинках — обобщённые мультяшные фигуры в цветах команд, не портреты; имена, клубы и
# числа — подписями из facts.json (источники в sources.md). Ведущие — Златик и Маша из «Золотого мяча».
reel: 1
style: cartoon
title: 'Звёзды футбола: собираем альбом'
lang: ru
format: { preset: vertical, fps: 30 }
voice: { engine: qwen3, voice: assets/voice/narrator-ru.wav, speed: 1.12 }
music: { bpm: 124, key: G, progression: [I, V, vi, IV], gain: 0.16, drop: ch-attack }
loudness: -14
brand: ../../brand.yaml
overlay: overlay.js
data: { facts: facts.json }
stills: { cover: intro@go, yamal: p-yamal@baby, keepers: p-courtois@tall, close: outro@tell }
images:
  # GPT Image through the Codex CLI: recognisable, drawing-like pictures (compared with Z-Image on
  # 24.10.2026: content/videos/football-stars-kids/README.md#pictures); not reproducible by seed
  provider: codex
  model: gpt-6-astra
  seed: 41
  width: 1088
  height: 1920
  prompt: >-
    Hand-drawn children's book illustration, confident ink outlines with coloured pencil and watercolour
    texture, warm rich palette, a detailed lively background full of small things to discover, expressive
    friendly caricature, tall vertical composition with the upper quarter of the frame kept calm. {subject}.
    No text, no letters, no numbers, no logos, no club crests, no sponsor logos, no flags, no watermark.
  cast:
    ball: >-
      Zlatik, a small round shiny golden football with a big happy cartoon face, large sparkly eyes,
      rosy cheeks, tiny arms in white gloves and short legs in red sneakers
    kid: >-
      Masha, a cheerful eight-year-old girl with two ginger pigtails and freckles, wearing a plain green
      t-shirt without any print, blue shorts and white football boots
post:
  title: 'Звёзды футбола: собираем альбом! Мультик для детей'
  text: |
    Собираем альбом из 14 звёзд футбола: Роналдиньо, Ламин Ямаль, Майкл Олисе, Усман Дембеле, Лаутаро Мартинес, Хулиан Альварес, Ромелу Лукаку, Лука Модрич, Кевин Де Брюйне, Арда Гюлер, Дейн Сент-Клэр, Мануэль Нойер, Джанлуиджи Доннарумма и Тибо Куртуа. О каждом — один весёлый факт.

    Футболисты нарисованы как дружеские шаржи, Златик и Маша — наши персонажи; ролик не связан с клубами и игроками. Клубы и факты проверены по открытым источникам 24 октября 2026 года (список в описании выпуска). Голос синтезирован (Qwen3-TTS), картинки сгенерированы (Z-Image-Turbo).
  tags: [футбол, детям, мультик, Ямаль, Месси, Модрич]
scenes:
  - id: intro
    scene: illustration
    say: 'Привет! Сегодня соберём альбом {#album}из четырнадцати звёзд футбола — и о каждой узнаем весёлый факт. {#go}Поехали!'
    pad: [0.1, 0.3]
    energy: 0.5
    sfx: [{ at: go, kind: whoosh, gain: 0.4, snap: half }]
    props:
      shots:
        - { image: shots/intro-1.jpg, prompt: '@kid and @ball sitting on a cosy rug in a sunny children''s room full of football posters without text, toys and a shelf of balls, opening a big sticker album with empty colourful card slots, a pile of blank sticker packs beside them', move: in, focus: { x: 0.5, y: 0.6 } }
      title: { text: Альбом звёзд, at: album }

  - id: ch-attack
    scene: kinetic
    say: 'Сначала {#k}атака!'
    pad: [0.1, 0.3]
    energy: 0.8
    transition: { kind: cut, dur: 0 }
    sfx: [{ at: k, kind: hit, gain: 0.45, snap: beat }]
    props:
      background: '#1f6f4a'
      align: center
      lines:
        - { text: 'Сначала', weight: light }
        - { text: 'атака!', tone: accent2, mode: slam, size: 1.4 }

  - id: p-ronaldinho
    scene: illustration
    say: 'Роналдиньо из Бразилии {#goals}в тринадцать лет забил все двадцать три гола в одном матче!'
    pad: [0.1, 0.35]
    energy: 0.8
    sfx: [{ at: goals, kind: chime, gain: 0.45, snap: half }]
    props:
      shots:
        - { image: shots/ronaldinho-1.jpg, prompt: 'a friendly recognisable caricature of the Brazilian footballer Ronaldinho with his long curly black hair held back by a headband and his famous huge toothy smile, in a plain yellow shirt with green trim and blue shorts, juggling a ball on a sunny beach pitch in Rio with palm trees, kites and children watching', move: in, focus: { x: 0.5, y: 0.6 } }
        - { at: goals, image: shots/ronaldinho-2.jpg, prompt: 'a thirteen-year-old boy who is clearly a young Ronaldinho, curly black hair and a huge toothy smile, in a plain yellow shirt, standing proudly in front of a small goal whose net overflows with dozens of footballs, cheering neighbourhood kids around him', move: out, focus: { x: 0.5, y: 0.6 } }
      title: { textFrom: facts.ronaldinho.surname, at: -1, until: goals }
      badge: { valueFrom: facts.ronaldinho.goals.value, labelFrom: facts.ronaldinho.goals.label, at: goals, y: 0.04, side: left }
      labels:
        - { textFrom: facts.ronaldinho.clubs, x: 0.4, y: 0.6, at: 0.3, tone: mustard }
        - { textFrom: facts.ronaldinho.country, x: 0.4, y: 0.655, at: 0.5, tone: blue }

