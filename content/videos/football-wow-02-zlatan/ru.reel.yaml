    say: Вратарь англичан Джо Харт {#head}выбежал из ворот.
    pad:
      - 0.1
      - 0.15
    min: 0
    props:
      shots:
        - image: shots/header-v2.png
          move: in
          zoom: 0.02
          focus:
            x: 0.5
            y: 0.58
      labels:
