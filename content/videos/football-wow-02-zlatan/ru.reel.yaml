        kind: swell
        gain: 0.08
  - id: result
    scene: illustration
    say: Все четыре гола Швеции забил Златан! {#win}Победа — четыре:два!
    pad:
      - 0.05
      - 0.7
    min: 0
    props:
      shots:
        - image: shots/celebration.png
          move: in
          zoom: 0.02
          focus:
            x: 0.5
            y: 0.58
      labels:
