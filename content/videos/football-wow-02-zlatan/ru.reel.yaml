    scene: illustration
    say: Мяч летит {#net}в ворота! Гол!
    pad:
      - 0.1
      - 0.5
    min: 0
    props:
      shots:
        - image: shots/flight.png
          move: in
          zoom: 0.02
          focus:
            x: 0.5
            y: 0.58
        - image: shots/net.png
          at: net
          move: in
          zoom: 0.02
          focus:
            x: 0.5
            y: 0.58
