          at: 0
          y: 0.245
  - id: turn
    scene: illustration
    say: Златан — спиной к воротам.
    pad:
      - 0.05
      - 0.15
    min: 2
    props:
      shots:
        - image: shots/turn-v3.png
          move: in
          zoom: 0.02
          focus:
            x: 0.5
            y: 0.58
    voice:
      source: assets/voice/corrections/turn.wav
  - id: kick
    scene: illustration
    say: Прыжок — {#strike}и удар через себя!
    pad:
      - 0.05
      - 0.28
    min: 2.45
    props:
      shots:
        - image: shots/lift.png
          move: in
          zoom: 0.02
          focus:
            x: 0.5
            y: 0.58
        - image: shots/kick.png
          at: strike
          move: in
          zoom: 0.02
          focus:
            x: 0.5
            y: 0.58
      fade: 0
    sfx:
      - at: strike
        kind: thud
        gain: 0.13
