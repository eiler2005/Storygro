post:
  title: "Интер Майами: финальный пас — футбольный комикс"
  text: >-
    Шесть звёзд «Интер Майами» и одна командная задача: помочь Маше создать гол. Месси, Суарес, Де Пауль,
    Каземиро, Бертераме и Сент-Клэр. Приключение вымышленное; биографические факты проверены 25 октября 2026
    года.


    Рисованный мир создан GPT Image; настоящие портреты — с официальных страниц Inter Miami CF / MLS, права
    сохраняются у их владельцев. Голос синтетический: Qwen3-TTS, не голос футболистов. Ролик не связан с
    клубом и не одобрен игроками. Источники: sources.md. Версия для семейного просмотра.
  tags:
    - футбол
    - ИнтерМайами
    - Месси
    - детям
    - команда
