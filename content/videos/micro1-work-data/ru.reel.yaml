  - id: outro
    scene: collage
    say: >-
      За эти деньги покупают знания о том, {#work}как устроена работа.
      Начните с одного процесса. {#save}Соберите примеры. Проверьте результат.
    pad: [0.15, 1.25]
    energy: 0.45
    sfx: [{ at: save, kind: chime, gain: 0.35 }]
    props:
      layers:
        - { kind: label, text: 'ЦЕННОСТЬ — В ОПЫТЕ', x: 0.02, y: 0.02, w: 0.96, h: 0.13, at: -1, size: 48, background: blue, rotate: -2, enter: pop }
