        - { kind: image, srcFrom: facts.assets.analyst, x: -0.02, y: 0.48, w: 0.72, h: 0.42, at: -1, enter: left }
        - { kind: image, srcFrom: facts.assets.robot, x: 0.53, y: 0.51, w: 0.48, h: 0.40, at: -1, enter: right }
        - { kind: label, text: 'СОБЕРИТЕ ПРИМЕРЫ', x: 0.03, y: 0.92, w: 0.94, h: 0.08, at: save, size: 32, enter: rise }
