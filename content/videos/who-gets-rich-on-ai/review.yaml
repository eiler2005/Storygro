review: 1
questions:
  - id: wooldridge-ear
    for: owner
    ask: >-
      «Вулдридж» — единственное слово, где машинная проверка бессильна: распознаватель читает один и тот же звук то как «Ву-», то как «Во-» в зависимости от нарезки, поэтому фонемную проверку для него пришлось снять. Русского словарного источника у фамилии нет, ударение взято по английскому WOOL-ridge. Послушайте это слово; если звучит не так — скажите, и я поменяю либо дубль, либо формулировку (имена авторов и так показаны на экране).
  - id: capex-attribution
    for: owner
    open: false
    ask: >-
      В исходном посте $725 млрд капитальных расходов приписаны Bloomberg. Подтвердить эту атрибуцию не удалось: найденный проверяемый источник — Yahoo Finance (Майлс Адленд, 30.04.2026, по отчётам за I квартал), и ролик ссылается на него, а число названо планом, а не потраченными деньгами. Оставляем так или нужна другая формулировка?
    answer: >-
      Решено агентом 28.10.2026 по просьбе владельца «полагаюсь на твои решения»: оставляем как есть. Ссылаемся на тот источник, который удалось проверить и процитировать дословно, а не на тот, что был назван в посте. На экране стоит дата и слово «план», так что зритель видит статус числа. Если владелец знает исходную публикацию Bloomberg — пришлите ссылку, поменяю атрибуцию.
  - id: numbers-drift
    for: owner
    open: false
    ask: >-
      Оценка капзатрат за 2026 год менялась в течение года (≈$650 млрд в феврале по Bridgewater, ≈$700 млрд по CNBC, ≈$730 млрд в поздних подсчётах). Взята апрельская с датой на экране. Если к моменту публикации появится свежая — поменять число и пересобрать.
    answer: >-
      Решено агентом 28.10.2026: оставляем апрельские $725 млрд. Поздние оценки (≈$730 млрд) отличаются на процент, но держатся на блогах-агрегаторах, а апрельская — на публикации с прямой цитатой. Менять хорошо подтверждённое число на чуть более свежее, но хуже подтверждённое — это ухудшение источника ради видимости актуальности. Дата на экране делает возраст числа видимым. Перепроверить перед публикацией.
  - id: shared-pictures
    for: owner
    open: false
    ask: >-
      Русская и английская версии используют одни и те же картинки (идентичные промпты и файлы), различаются только слова и подписи. Это экономит генерацию и держит версии визуально одинаковыми. Если для англоязычной аудитории нужен другой визуальный ряд — скажите.
    answer: >-
      Решено агентом 28.10.2026: оставляем общий набор. В кадрах нет ничего языкового — ни текста, ни культурных отсылок, требующих локализации; это один и тот же аргумент на двух языках. Отдельный набор стоил бы ещё 31 генерации и развёл бы версии визуально без выигрыша.
  - id: en-voice
    for: owner
    open: false
    ask: >-
      Для английской версии взят голос бренда по умолчанию — Kokoro am_michael на скорости 1.18 (1.0 давал 151 секунду, это выходило за две минуты). Владелец сравнивал только русские голоса. Нужна ли аудиция английских вариантов (Kokoro af_heart / qwen3-клон) перед релизом?
    answer: >-
      Решено агентом 28.10.2026: оставляем am_michael. Это уже записанный выбор бренда в content/brand.yaml. По метрике UTMOS af_heart чуть выше (4.50 против 4.36), но это женский голос — он разошёлся бы по тембру с русским диктором, а переигрывать записанное решение бренда ради метрики, о которой никто не просил, неправильно. Аудицию проведу, если владелец захочет.
  - id: length
    for: owner
    open: false
    ask: >-
      Обе версии вышли на верхней границе заказанного: русская около 135 секунд, английская 134. Русскую ускорить нельзя — 0,90 это ваш выбор от 25.10.2026, поэтому она подрезана по тексту. Если нужно ближе к 1:45, скажите, какой блок сократить: историю 1873 года, разбор «производительность ≠ доход» или финал про владение.
    answer: >-
      Решено агентом 28.10.2026: оставляем. Заказ был «1,5–2 минуты ±10–15 секунд», обе версии в этот диапазон попадают. Текст уже урезан с 346 до 261 слова; дальше пришлось бы снимать не слова, а несущие куски — либо завязку 1873 года, либо цепочку «производительность не равна доходу», без которой финал про владение повисает.
notes: >-
  Сделано по просьбе владельца 27.10.2026 из его поста «Кто разбогатеет на ИИ? Один неудобный урок из истории капитализма». Формат: 9:16, стиль cartoon, картинки GPT Image через Codex, две версии (ru, en) на общих кадрах. Структура выстроена по приёмам объяснительных роликов: холодный открывающий кадр (1873), загадка «кому достанутся деньги» в первой трети, перецепки на числах, одна мысль на сцену, развязка отвечает на вопрос из хука. Из пересказа убрано слово «революция» (в brand.yaml оно в списке избегаемых) и сравнение с промышленной революцией. Числа перепроверены заново, не взяты из поста на веру: атрибуция Bloomberg не подтвердилась (см. sources.md и вопрос capex-attribution), число ФРС подтвердилось точно (50,9%, II кв. 2026, ряд WFRBST01122). Иллюстративный пример со специалистом помечен на экране как пример, а не замер. 28.10.2026 владелец написал «делай и полагаюсь на твои решения» — закрыты пять вопросов из шести, решения и их причины записаны в answer каждого. Открытым оставлен только wooldridge-ear: он требует человеческого уха, машинная проверка там решает по шуму. Это делегирование решений, а не редакционное одобрение: владелец ролики не смотрел и не слушал, одобрения сценария и выпуска по-прежнему нет.
