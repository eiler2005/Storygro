questions:
  - id: capex-attribution
    for: owner
    ask: >-
      В исходном посте $725 млрд капитальных расходов приписаны Bloomberg. Подтвердить эту атрибуцию не удалось: найденный проверяемый источник — Yahoo Finance (Майлс Адленд, 30.04.2026, по отчётам за I квартал), и ролик ссылается на него, а число названо планом, а не потраченными деньгами. Оставляем так или нужна другая формулировка?
  - id: numbers-drift
    for: owner
    ask: >-
      Оценка капзатрат за 2026 год менялась в течение года (≈$650 млрд в феврале по Bridgewater, ≈$700 млрд по CNBC, ≈$730 млрд в поздних подсчётах). Взята апрельская с датой на экране. Если к моменту публикации появится свежая — поменять число и пересобрать.
  - id: shared-pictures
    for: owner
    ask: >-
      Русская и английская версии используют одни и те же картинки (идентичные промпты и файлы), различаются только слова и подписи. Это экономит генерацию и держит версии визуально одинаковыми. Если для англоязычной аудитории нужен другой визуальный ряд — скажите.
  - id: en-voice
    for: owner
    ask: >-
      Для английской версии взят голос бренда по умолчанию — Kokoro am_michael на скорости 1.18 (1.0 давал 151 секунду, это выходило за две минуты). Владелец сравнивал только русские голоса. Нужна ли аудиция английских вариантов (Kokoro af_heart / qwen3-клон) перед релизом?
  - id: length
    for: owner
    ask: >-
      Обе версии вышли на верхней границе заказанного: русская 135 секунд, английская 134. Русскую ускорить нельзя — 0,90 это ваш выбор от 25.10.2026, поэтому она подрезана по тексту. Если нужно ближе к 1:45, скажите, какой блок сократить: историю 1873 года, разбор «производительность ≠ доход» или финал про владение.
notes: >-
  Сделано по просьбе владельца 27.10.2026 из его поста «Кто разбогатеет на ИИ? Один неудобный урок из истории капитализма». Формат: 9:16, стиль cartoon, картинки GPT Image через Codex, две версии (ru, en) на общих кадрах. Структура выстроена по приёмам объяснительных роликов: холодный открывающий кадр (1873), загадка «кому достанутся деньги» в первой трети, перецепки на числах, одна мысль на сцену, развязка отвечает на вопрос из хука. Из пересказа убрано слово «революция» (в brand.yaml оно в списке избегаемых) и сравнение с промышленной революцией. Числа перепроверены заново, не взяты из поста на веру: атрибуция Bloomberg не подтвердилась (см. sources.md и вопрос capex-attribution), число ФРС подтвердилось точно (50,9%, II кв. 2026, ряд WFRBST01122). Иллюстративный пример со специалистом помечен на экране как пример, а не замер.
