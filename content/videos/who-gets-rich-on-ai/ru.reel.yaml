# «Кто разбогатеет на ИИ» — объяснительный ролик для взрослых (стиль cartoon), 9:16, около двух минут.
# Пересказ поста владельца (26.10.2026) о книге Гринспена и Вулдриджа и о стройке ИИ-инфраструктуры.
# Структура детективная: холодная сцена 1873 года → загадка «кому достанутся деньги» → разбор → ответ.
# Числа только из facts.json (valueFrom / textFrom), в картинках текста нет. Кадры общие с en.reel.yaml:
# идентичные id, файлы, промпты и реплики {#cue}, меняются только слова — поэтому картинки рисуются один раз.
reel: 1
style: cartoon
title: 'Кто разбогатеет на ИИ'
lang: ru
format: { preset: vertical, fps: 30 }
safe: phone
voice:
  engine: omnivoice
  model: k2-fsa/OmniVoice
  voice: assets/voice/narrator-ru.wav
  speed: 0.9
  # the owner's baseline is `off`; this episode uses `marks` only so that the checked dictionary
  # stress for the names (Джей Кук, Гринспен, Вулдридж, Нью-Йорк) reaches OmniVoice. Unmarked lines
  # are unchanged by it — see docs/reference/voices.md and production/voices/lexicon-ru.yaml.
  stress: marks
music: { bpm: 88, key: A, progression: [vi, IV, I, V], gain: 0.12, drop: shift#now }
loudness: -14
theme: theme.css
captions: { show: true, maxWords: 5 }
# QA then checks the brand's avoided phrases and that the post discloses the synthetic voice
brand: ../../brand.yaml
data: { facts: facts.json }
stills:
  cover: panic@rails
  turn: paradox@but
  money: capex@money
  owners: owners@own
  close: shift@asset
images:
  # GPT Image через Codex CLI: рисованные, подробные кадры (docs/how-to/kids-list-cartoon.md)
  provider: codex
  model: gpt-6-astra
  seed: 73
  width: 1088
  height: 1920
  prompt: >-
    Hand-drawn editorial illustration for a grown-up documentary, confident ink outlines with coloured
    pencil and watercolour texture, warm restrained palette of cream, teal, mustard, rust and deep ink
    blue, dramatic cinematic light, a highly detailed believable background full of small things to
    discover, expressive human characters with clear readable faces and consistent designs, tall
    vertical composition with the main action in the middle and lower part of the frame and the top
    fifth calm and uncluttered. {subject}. No text, no letters, no numbers, no charts with labels, no
    logos, no brand marks, no watermark.
  cast:
    tycoon: >-
      a railway investor of the 1870s (a stout middle-aged man with thick grey side-whiskers, a tall
      black silk top hat, a burgundy frock coat over a cream waistcoat and a gold watch chain)
    banker: >-
      an elderly American economist (a thin man in his eighties with thinning grey hair, very large
      thick round glasses, a dark grey suit and a quiet, careful expression)
    anna: >-
      Anna (a professional woman in her thirties with dark brown hair in a low bun, small round
      glasses, a grey blazer over a white shirt, calm attentive eyes)
    viktor: >-
      Viktor (a friendly accountant in his forties with short sandy hair, a neat beard, rolled-up blue
      shirtsleeves and reading glasses pushed up on his forehead)
post:
  title: 'Кто разбогатеет на ИИ: один неудобный урок из истории капитализма'
  text: |
    В 1873 году банк Джея Кука рухнул на железнодорожных облигациях, и 89 из 364 американских железных дорог ушли в банкротство (PBS, American Experience). При этом железные дороги оказались одним из лучших, что случалось с экономикой США. Технология сделала общество богаче — а богатыми стали далеко не все, кто в неё вложился.

    Об этом «Капитализм в Америке» Алана Гринспена и Адриана Вулдриджа. Гринспен возглавлял ФРС с 1987 по 2006 год, а в 2008-м сказал Конгрессу: «Я обнаружил изъян».

    Сегодня Microsoft, Amazon, Alphabet и Meta запланировали на 2026 год около $725 млрд капитальных расходов (Yahoo Finance, 30.04.2026, по отчётам за I квартал — это план, а не потраченные деньги). А доступ к результату стоит несколько десятков долларов в месяц. Строить технологию всё дороже, пользоваться — всё дешевле.

    Но производительность — не то же самое, что доход: если исследование за день умеют делать все, падает его цена. И собственность уже сосредоточена: 50,9% корпоративных акций американских домохозяйств у верхнего 1% (ФРС, распределительные счета, II кв. 2026).

    Что действительно меняется: знание больше не обязано продаваться как время. Бухгалтер может собрать сервис, инженер — превратить методику в продукт. Не часы, а актив. Взлетит не каждый проект: ИИ удешевляет производство, но спроса не создаёт.

    Источники и оговорки — в sources.md. Закадровый голос синтезирован (OmniVoice), картинки сгенерированы GPT Image; см. CREDITS.md.
  tags: [ИИ, экономика, капитализм, история, будущее работы, предпринимательство]

scenes:
  - id: panic
    scene: illustration
    say: 'Осень [1873](=тысяча восемьсот семьдесят третьего). {#bank}Банк Джея Кука рушится, биржа
      в Нью-Йорке закрывается на десять дней. {#rails}Банкротится почти каждая четвёртая железная
      дорога страны.'
    pad: [0.2, 0.45]
    energy: 0.5
    sfx: [{ at: bank, kind: thud, gain: 0.5 }, { at: rails, kind: hit, gain: 0.45 }]
    props:
      fade: 0.25
      shots:
        - { image: shots/panic-1.jpg, prompt: 'a dense crowd of men in top hats and long frock coats pressing against the closed stone doors of a city bank on a wet autumn morning in 1873, newspapers trampled underfoot, horse-drawn cabs behind them', move: in, focus: { x: 0.5, y: 0.55 } }
        - { at: bank, image: shots/panic-2.jpg, prompt: 'the heavy iron-bound doors of a nineteenth-century bank being chained shut from inside by a frightened clerk, seen through rain-streaked glass, the crowd blurred outside', move: out }
        - { at: rails, image: shots/panic-3.jpg, prompt: 'a vast railway yard of cold rusting steam locomotives standing abandoned under a low grey sky, weeds growing high between the rails, a lone watchman walking away', move: in }
      badge: { valueFrom: facts.panic.value.ru, labelFrom: facts.panic.label.ru, at: rails, side: right, y: 0.1 }
      source: { textFrom: facts.panic.sourceLine.ru }

  - id: paradox
    scene: illustration
    say: 'Парадокс: {#good}железные дороги оказались лучшим, что случалось с экономикой США.
      {#but}Технология сделала общество богаче. А вложившихся в неё — далеко не всех.'
    pad: [0.2, 0.5]
    energy: 0.45
    props:
      fade: 0.25
      shots:
        - { image: shots/paradox-1.jpg, prompt: 'a steam locomotive crossing a tall wooden trestle bridge over a wide canyon at golden hour in the American West, smoke trailing, tiny settlers waving from a wagon below', move: left }
        - at: but
          image: shots/paradox-2a.jpg
          prompt: '@tycoon alone in a dim emptied office, slumped in a chair, loose engraved share certificates scattered over the floor around his feet, an unlit lamp'
          split: shots/paradox-2b.jpg
          splitPrompt: 'a lively prairie town market that grew beside a railway line, farmers unloading crates, children running, washing on lines, warm afternoon sun'
          move: none
      title: { text: 'Богаче — но не все', at: but, align: left, width: 0.55 }

  - id: question
    scene: illustration
    say: 'Отсюда вопрос. {#q}Если [ИИ](=искусственный интеллект) — новые железные дороги,
      кому достанутся деньги?'
    pad: [0.2, 0.55]
    energy: 0.6
    sfx: [{ at: q, kind: pop, gain: 0.5 }]
    props:
      fade: 0.25
      shots:
        - { image: shots/question-1.jpg, prompt: 'a pair of old railway tracks running out of a misty nineteenth-century landscape and turning into the straight service road of an enormous modern data centre at dusk, cooling units glowing softly', move: in }
      title: { text: 'Кому достанутся деньги?', at: q, align: left, width: 0.6 }

  - id: book
    scene: illustration
    # The given names are shown, not spoken: OmniVoice cannot be told the stress of «А́лан» — the
    # uppercase convention has nowhere to put the mark on a capitalised initial vowel, and a phoneme
    # check caught it saying «Ала́н». On screen the spelling is exact. See production/voices/lexicon-ru.yaml.
    say: 'Об этом книга «Капитализм в Америке». {#authors}Её авторы — Гринспен и историк Вулдридж.
      Гринспен девятнадцать лет возглавлял центральный банк США. {#flaw}В [2008](=две тысячи восьмом)
      он признал: в его модели мира нашёлся изъян.'
    pad: [0.2, 0.5]
    energy: 0.4
    sfx: [{ at: flaw, kind: thud, gain: 0.4 }]
    props:
      fade: 0.25
      shots:
        - { image: shots/book-1.jpg, prompt: 'a thick hardback history book lying open on a worn wooden desk under a green banker lamp, beside it a brass pocket watch and a cold cup of coffee, blank pages with no writing', move: in }
        - { at: authors, image: shots/book-2.jpg, prompt: '@banker standing thoughtfully in front of a tall marble central-bank building at dawn, holding his glasses in one hand', move: out, focus: { x: 0.5, y: 0.35 } }
        - { at: flaw, image: shots/book-3.jpg, prompt: '@banker sitting alone at a long witness table in a wood-panelled committee room, microphones in front of him, rows of empty seats behind, harsh overhead light', move: in, focus: { x: 0.5, y: 0.45 } }
      # the badge clears when the quote lands, so the two do not stack in the same corner
      badge: { valueFrom: facts.greenspan.value.ru, labelFrom: facts.greenspan.label.ru, at: authors, until: flaw, side: left, y: 0.08 }
      labels:
        - { textFrom: facts.greenspan.quote.ru, x: 0.5, y: 0.3, at: flaw, tone: red }
        - { textFrom: facts.greenspan.quoteLabel.ru, x: 0.5, y: 0.38, at: flaw, tone: ink }
      # the given names are credited here, not spoken: a label was too wide for the frame and sat on
      # the badge, while the source line is made for an attribution and wraps
      source: { textFrom: facts.book.authors.ru }

  - id: capex
    scene: illustration
    say: '{#money}Microsoft, Amazon, Alphabet и Meta запланировали на год до
      [$725 млрд](=семисот двадцати пяти миллиардов долларов) капитальных расходов.
      {#scale}Стройка размером с целую отрасль — за один год.'
    pad: [0.2, 0.5]
    energy: 0.65
    sfx: [{ at: money, kind: hit, gain: 0.55, snap: beat }]
    props:
      fade: 0.25
      shots:
        - { image: shots/capex-1.jpg, prompt: 'an enormous data centre under construction at night, tower cranes lit by floodlights, concrete shells stretching to the horizon, convoys of trucks queuing at the gate', move: in }
        - { at: scale, image: shots/capex-2.jpg, prompt: 'a bird eye view of a colossal windowless data centre campus filling a valley, a small old farming town with a church spire tucked beside it for scale, power lines marching away over the hills', move: out }
      badge: { valueFrom: facts.capex.value.ru, labelFrom: facts.capex.label.ru, at: money, side: right, y: 0.08 }
      source: { textFrom: facts.capex.sourceLine.ru }

  - id: flip
    scene: illustration
    say: '{#cheap}А доступ к результату — несколько десятков долларов в месяц. {#asym}Строить
      технологию всё дороже. Пользоваться — всё дешевле.'
    pad: [0.2, 0.5]
    energy: 0.5
    props:
      fade: 0.25
      shots:
        - { image: shots/flip-1.jpg, prompt: '@viktor sitting at a small kitchen table late in the evening with one laptop, a mug and a houseplant, warm lamplight, through the window behind him the distant glow of the vast data centre', move: in, focus: { x: 0.45, y: 0.5 } }
        - at: asym
          image: shots/flip-2a.jpg
          prompt: 'a towering construction site of steel and concrete seen from below, cranes against a hard blue sky, dozens of hard-hatted workers like ants'
          split: shots/flip-2b.jpg
          splitPrompt: 'a single open laptop glowing on a plain wooden table in a quiet room, one coffee cup beside it, soft morning light'
          move: none
      title: { text: 'Строить дорого, пользоваться дёшево', at: asym, align: left, width: 0.62, size: 0.055 }

  - id: trap
    scene: illustration
    say: 'Но производительность — не доход. {#week}Исследование недели делается за день.
      {#all}Но если это умеют все, цена падает. {#split}Выигрывает заказчик, часть берёт
      работодатель, часть — поставщик модели. {#worker}Специалисту прибавка не достаётся.'
    pad: [0.2, 0.55]
    energy: 0.55
    sfx: [{ at: worker, kind: thud, gain: 0.45 }]
    props:
      fade: 0.25
      shots:
        - { image: shots/trap-1.jpg, prompt: '@anna at midnight almost buried behind towering stacks of reports and folders on her desk, seven paper coffee cups around her, rubbing her eyes', move: in }
        - { at: all, image: shots/trap-2.jpg, prompt: 'a long open-plan office where a dozen identical tidy desks each hold a glowing laptop and a neat finished report, every worker leaning back relaxed at the same moment, flat even daylight', move: left }
        - { at: split, image: shots/trap-3.jpg, prompt: 'a large gold coin on a workshop bench being carefully sliced into four uneven wedges with a chisel, four pairs of hands reaching in from the edges of the frame', move: in, focus: { x: 0.5, y: 0.55 } }
        - { at: worker, image: shots/trap-4.jpg, prompt: '@anna standing by a window holding a thin paper payslip, looking at it with a flat tired expression, the office behind her already dark', move: out, focus: { x: 0.6, y: 0.4 } }
      labels:
        - { textFrom: facts.specialist.before.ru, x: 0.26, y: 0.2, at: week, until: all, tone: red }
        - { textFrom: facts.specialist.after.ru, x: 0.72, y: 0.2, at: week, until: all, tone: teal }
        - { textFrom: facts.split.client.ru, x: 0.22, y: 0.18, at: split, until: worker, tone: teal }
        - { textFrom: facts.split.employer.ru, x: 0.62, y: 0.13, at: split, until: worker, tone: mustard }
        - { textFrom: facts.split.vendor.ru, x: 0.68, y: 0.26, at: split, until: worker, tone: blue }
        - { textFrom: facts.split.worker.ru, x: 0.3, y: 0.3, at: worker, tone: red }
      source: { textFrom: facts.specialist.label.ru }

  - id: owners
    scene: illustration
    say: '{#own}Собственность уже сосредоточена. Больше половины корпоративных акций в США —
      у одного процента самых богатых семей. {#stocks}Рост рынка сам по себе большинство
      не обогащает.'
    pad: [0.2, 0.5]
    energy: 0.5
    sfx: [{ at: own, kind: hit, gain: 0.45 }]
    props:
      fade: 0.25
      shots:
        - { image: shots/owners-1.jpg, prompt: 'a cutaway of a tall narrow apartment tower where one vast luxurious penthouse occupies the whole upper half of the building and dozens of tiny cramped flats are stacked in the lower half', move: in }
        - { at: stocks, image: shots/owners-2.jpg, prompt: 'a crowd of ordinary people on a cold pavement at night looking up through a plate-glass window at a bright trading floor where a line on a wall display climbs steeply, no words or figures on the display', move: out }
      badge: { valueFrom: facts.equities.value.ru, labelFrom: facts.equities.label.ru, at: own, side: right, y: 0.08 }
      source: { textFrom: facts.equities.sourceLine.ru }

  - id: shift
    scene: illustration
    say: 'Но отличие есть. {#time}Раньше знание продавали как время: больше клиентов, дороже
      проекты. {#grow}Чтобы вырасти — люди, офис, деньги. {#now}Теперь бухгалтер соберёт сервис,
      инженер превратит методику в продукт. {#asset}Это другая экономика: не часы, а актив.'
    pad: [0.2, 0.55]
    energy: 0.7
    sfx: [{ at: now, kind: pop, gain: 0.55, snap: beat }, { at: asset, kind: chime, gain: 0.5 }]
    props:
      fade: 0.25
      shots:
        - { image: shots/shift-1.jpg, prompt: '@viktor in a small office handing a client a neat stack of finished papers across the desk while an oversized wall clock above them dominates the room, a queue of three more clients waiting at the door', move: in }
        - { at: grow, image: shots/shift-2.jpg, prompt: 'a cramped old office being expanded: movers carrying in extra desks and filing cabinets through a narrow door, an overwhelmed manager counting on his fingers, plaster dust in the air', move: left }
        - { at: now, image: shots/shift-3.jpg, prompt: '@viktor alone at his kitchen table building something on a laptop, around him float small glowing mechanical gears and tidy little paper machines assembling themselves, confident focused expression, warm night light', move: in, focus: { x: 0.5, y: 0.5 } }
        - { at: asset, image: shots/shift-4.jpg, prompt: '@viktor asleep in an armchair at home with a blanket and a cat, while on the desk beside him a small tidy brass machine quietly keeps turning and dropping coins into a jar, moonlight through the window', move: out }
      # no «часы»/«актив» labels here: they collided with the headline band, which says the same words
      title: { text: 'Не часы, а актив', at: asset, align: right, width: 0.45 }

  - id: caveat
    scene: illustration
    say: 'Взлетит не каждый. Нужны клиенты, доверие, понимание рынка. {#demand}Технология
      удешевляет производство, но спрос не создаёт.'
    pad: [0.2, 0.5]
    energy: 0.4
    props:
      fade: 0.25
      shots:
        - { image: shots/caveat-1.jpg, prompt: '@anna standing hopefully beside a small handmade market stall of neatly arranged goods on an empty street at dawn, not a single customer in sight, shutters still down opposite', move: in, focus: { x: 0.4, y: 0.5 } }
        - { at: demand, image: shots/caveat-2.jpg, prompt: 'a beautifully built little workshop with its door propped open and a welcome mat, perfect tools laid out inside, an empty path of untrodden grass leading to it', move: out }
      title: { text: 'Спрос не создаётся сам', at: demand, align: left, width: 0.55 }

  - id: close
    scene: illustration
    say: '{#two}Капитал концентрируется у гигантов — и рядом появляются тысячи маленьких дел.
      {#chance}Может быть, главный шанс не в том, чтобы делать в десять раз больше,
      {#cta}а в том, чтобы владеть тем, что создаёт ценность и без вас.'
    pad: [0.2, 1.2]
    energy: 0.6
    sfx: [{ at: cta, kind: chime, gain: 0.55 }]
    props:
      fade: 0.25
      shots:
        - at: two
          image: shots/close-1a.jpg
          prompt: 'one colossal mirrored corporate tower rising alone above low clouds, seen from far below'
          split: shots/close-1b.jpg
          splitPrompt: 'a warm narrow street of dozens of tiny lit workshops and studios, each with its own open door and a person working inside'
          move: none
        - { at: chance, image: shots/close-2.jpg, prompt: '@anna standing at a fork in a country road at sunrise with a small bag, one path leading to distant towers and the other to a cluster of small bright workshops, she is looking at both', move: in, focus: { x: 0.5, y: 0.5 } }
        - { at: cta, image: shots/close-3.jpg, prompt: '@viktor opening a window at sunrise and stretching, behind him on the desk the small brass machine still turning by itself, first light filling the room', move: in, focus: { x: 0.5, y: 0.45 } }
      title: { text: 'Владеть, а не только работать', at: cta, align: left, width: 0.58, size: 0.058 }
