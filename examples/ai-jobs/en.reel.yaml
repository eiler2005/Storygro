# "What AI means for jobs — and where the real danger is". English variant, 9:16.
# Same mechanism as the Russian variant, written for a global audience: ILO's global exposure index
# instead of the HSE estimate for Russia. Sources: sources.md.
reel: 1
title: AI and jobs — where the real danger is
lang: en
format: { preset: vertical, fps: 30 }
voice: { engine: qwen3, voice: assets/voice/narrator-en.wav }
music: { bpm: 84, key: A, progression: [vi, IV, I, V], gain: 0.3 }
loudness: -14
theme: theme.css
captions: { show: true, maxWords: 5 }
transition: { kind: fade, dur: 0.4 }
data: { facts: facts.json }
hooks:
  - Companies aren't firing you because of AI. They're just not hiring the next you.
  - Forty percent of jobs are exposed to AI. So where are the layoffs?
stills:
  cover: hook
  ladder: ladder@gap
post:
  title: AI isn't taking jobs away. It's taking away the first rung.
  text: |
    Why AI isn't causing mass layoffs yet — and why that's no reason to relax.

    • A job is a bundle of tasks. AI takes the ones that are easiest to check: gathering data, first drafts, summaries.
    • Those tasks were how beginners learned. In the US, employment of 22–25-year-olds in the most AI-exposed jobs fell about 11% since late 2022, while it grew about 10% in the least exposed jobs. They're not being fired; fewer are being hired (Stanford Digital Economy Lab, 2026). The authors call it an early signal, not proof of cause.
    • Worldwide, 1 in 4 workers are in jobs with some exposure to generative AI, but only 3.3% are in the highest-exposure group (ILO, 2025).

    The danger isn't mass layoffs tomorrow. It's that in ten years there's no one ready to be senior.

    Sources in the first comment. The narration is synthetic (Qwen3-TTS); the voice is not a real person's.
  tags: [AI, jobs, careers, futureofwork, entrylevel]

scenes:
