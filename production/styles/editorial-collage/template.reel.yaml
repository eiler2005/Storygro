# {title} — an editorial collage (style: editorial-collage). Each scene is a stack of layers: text,
# label, image cut-out, panel, arrow. Put cut-out pictures (PNG with alpha) in assets/.
reel: 1
style: editorial-collage
title: '{title}'
lang: {lang}
data: { facts: facts.json }
post:
  title: '{title}'
  text: |
    One paragraph on what the viewer learns.

    Sources: … The narration is synthetic.
  tags: []
scenes:
  - id: hook
    scene: collage
    say: 'The provocative question. {#who}Who answers it?'
    pad: [0.2, 0.7]
    props:
      layers:
        - { kind: text, text: 'THE HEADLINE.', x: 0, y: 0.04, w: 1, h: 0.17, size: 84, at: -1, enter: pop }
        - { kind: label, text: 'THE QUESTION?', x: 0.05, y: 0.24, w: 0.9, h: 0.13, size: 58, at: who, rotate: -3, background: blue, enter: drop }
  - id: mechanism
    scene: collage
    say: 'How it works, step by step. {#check}Where it can go wrong.'
    props:
      layers:
        - kind: panel
          title: The process
          x: 0.02
          y: 0.1
          w: 0.96
          h: 0.4
          at: -1
          rows:
            - { text: First step, at: 0.3, color: blue }
            - { text: Second step, at: 1.2, color: blue }
            - { text: What can fail, at: check, color: red }
  - id: outro
    scene: collage
    say: 'The takeaway. {#ask}What do you think?'
    pad: [0.2, 1.6]
    props:
      layers:
        - { kind: text, text: 'THE TAKEAWAY.', x: 0, y: 0.1, w: 1, h: 0.2, size: 80, at: -1, enter: pop }
        - { kind: label, text: 'TELL US', x: 0.2, y: 0.4, w: 0.6, h: 0.12, size: 56, at: ask, background: red, enter: drop }
