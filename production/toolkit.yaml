# The Storygro toolkit: every method and tool for making content, by production stage.
# Agents read this file to pick an approach; people read docs/reference/toolkit.md, generated from it
# by `npm run docs:toolkit`. tests/toolkit.test.ts keeps it complete: every CLI command, style and
# scene must appear here, and every link must resolve.
#
# kind:   method (a way of working) · tool (a command or script) · style (a reusable look and method)
#         · scenes (a family of scene modules) · provider (an external model or service behind a tool)
# status: stable · pilot (works, reviewed on one or two pieces) · planned (not implemented)
toolkit: 1

stages:
  choose: Pick a topic worth a piece
  research: Find and check what is true
  write: Turn it into a script as data
  look: Decide how it looks
  voice: Narration, sound and timing
  make: Storyboard, approval and rendering
  check: Technical QA and the human review
  ship: Release, publication record and metrics
  maintain: Keep the repository and its media healthy

entries:
  - id: football-wow-shorts
    kind: method
    stage: look
    title: Detailed cartoon-led football shorts
    what: A concise sourced football surprise with several connected illustrated action states, recognisable period players and supporting hosts; only 1–3 authentic photo inserts across the film.
    when: The owner commissions a short Football Wow episode or deliberately remakes a football film under the cartoon-led rule. Keep calm speech, document original/adapted text and measure illustrated/photo screen time.
    status: pilot
    docs: docs/how-to/football-series.md#cartoon-led-short-stories
    examples: [content/videos/football-wow-01-pele/DIRECTION.md, content/videos/football-wow-02-zlatan/DIRECTION.md]

  - id: editorial-ranking
    kind: tool
    stage: choose
    title: Editorial ranking
    what: Scores backlog ideas from six explicit 0–5 ratings with published weights; attention never enters the score.
    when: Choosing the next piece from content/ideas/backlog.yaml.
    commands: [ideas]
    how: npm run storygro -- ideas content/ideas/backlog.yaml
    status: stable
    docs: docs/how-to/choose-a-topic.md
    examples: [content/ideas/backlog.yaml]

  - id: trend-scan
    kind: tool
    stage: choose
    title: Trend scan and watchlist
    what: Google Trends RSS, Wikipedia pageviews and Hacker News without API keys; focus matches and momentum per backlog idea.
    when: Checking whether a topic is gaining attention; signals are context, never proof.
    commands: [trends]
    how: npm run storygro -- trends production/trends/sources.yaml --backlog content/ideas/backlog.yaml --md content/.signals/latest.md
    status: stable
    docs: docs/how-to/choose-a-topic.md
    examples: [content/research/ai-agent-checks/README.md]

  - id: research-scan
    kind: tool
    stage: choose
    title: Research scan with picks
    what: New GitHub repositories, Hugging Face papers, Hacker News best of the week, public Telegram channels, RSS feeds and imported X digests in one report; loud headlines set aside, the same link across sources noticed, a short ordered reading list.
    when: Looking for what is useful and new this week, not only what is loud; before writing angles.
    commands: [trends]
    how: npm run storygro -- trends production/trends/sources.yaml --inbox content/.signals/inbox --md content/.signals/latest.md
    status: pilot
    docs: docs/explanation/research-approach.md
    examples: [content/research/2026-10-20-scan.md]

  - id: x-digest
    kind: method
    stage: choose
    title: X digest through Grok
    what: A prompt that asks Grok for the week's most bookmarked useful posts with clickbait, giveaways and repeat authors excluded, in a format the scan imports.
    when: X has no free API; once a week, or when a topic needs the X conversation.
    how: Paste production/trends/x-digest-prompt.md into Grok; save the answer to content/.signals/inbox/; run the scan with --inbox.
    status: pilot
    docs: production/trends/x-digest-prompt.md

  - id: angle-lenses
    kind: method
    stage: choose
    title: Angles from a scan
    what: An agent playbook that reads the originals behind the picks, drops what lacks a primary source, and applies lenses (mechanism, cost, what it reveals, transfer, against the current, pairing two signals) to propose 3–5 backlog candidates.
    when: After a scan, before ranking; the source of non-obvious topics.
    how: Give the agent production/trends/angles-prompt.md with the latest report and the backlog.
    status: pilot
    docs: production/trends/angles-prompt.md

  - id: primary-source-research
    kind: method
    stage: research
    title: Primary-source research
    what: Each claim traced to a primary source with date, method, a verbatim quote and caveats; popular misquotes listed to avoid.
    when: Before any script; every number on screen needs it.
    how: Follow the agent procedure; write sources.md beside the reel.
    status: stable
    docs: production/research/WORKFLOW.md
    examples: [content/videos/ai-buys-work-knowledge/sources.md, examples/ai-jobs/sources.md]

  - id: facts-file
    kind: method
    stage: research
    title: Facts as data
    what: Every on-screen number and quoted phrase lives in facts.json with its source; scenes bind it (valueFrom, textFrom) and the facts gate rejects numbers that are not there.
    when: Always; never type a number into a scene.
    how: "Bind in props: badge: { valueFrom: facts.budget.value }"
    status: stable
    docs: docs/how-to/write-a-script.md
    examples: [content/videos/ai-buys-work-knowledge/facts.json]

  - id: reference-analysis
    kind: method
    stage: research
    title: Reference analysis
    what: Study a video that works — length, words per minute, structure with timestamps, cut rate, visual language, weak points — and record what to take and what never to copy.
    when: Before adopting a new format or building a style.
    commands: [transcript]
    how: Transcribe, sample frames, write content/research/references/<id>.md
    status: pilot
    docs: docs/how-to/transcribe-a-reference.md
    examples: [content/research/references/cYlePq4WQsk.md, content/research/references/gHFDPVjbOco.md, content/research/references/awesome-opus5-5-videos.md]

  - id: transcript
    kind: tool
    stage: research
    title: Transcript and pace statistics
    what: A pasted page transcript, a media file or a direct media URL → timed segments, Markdown, SRT, words per minute per minute, questions and numbers with times.
    when: Analysing a reference or checking your own narration.
    commands: [transcript]
    how: npm run storygro -- transcript private/references/<id>.txt --out private/references/<id>
    status: pilot
    docs: docs/how-to/transcribe-a-reference.md

  - id: whisper
    kind: provider
    stage: research
    title: Whisper (mlx-whisper)
    what: Local speech recognition on Apple silicon; used by transcript, word alignment and the QA speech check.
    when: Media without a transcript; every QA run.
    status: stable
    docs: docs/explanation/technology.md

  - id: script-as-data
    kind: method
    stage: write
    title: Script as data
    what: A YAML reel — scenes, narration with `{#cue}` sync points, `[written](=spoken)` pronunciation, props bound to facts, post text.
    when: Every video; the voice sets the timing, cues keep pictures on their words.
    commands: [new]
    how: npm run storygro -- new content/videos/<id> --style <style>, then edit <lang>.reel.yaml
    status: stable
    docs: docs/how-to/write-a-script.md
    examples: [content/videos/ai-buys-work-knowledge/en.reel.yaml]

  - id: story-structures
    kind: method
    stage: write
    title: Story structures
    what: "Each style carries its structure: cut-paper — hook, mechanism, evidence, action, close; cartoon — hook, promise, stages or one worked example, callback, caveat, close."
    when: Outlining a script; pick the style first.
    how: Read the structure in production/styles/<id>/style.yaml
    status: stable
    docs: docs/reference/styles.md

  - id: worked-example
    kind: method
    stage: write
    title: One worked example
    what: Make an abstract claim concrete through one person and one decision (the buyer who picks the pricier supplier), labelled illustrative on screen.
    when: The idea is about judgment or process rather than a statistic.
    status: pilot
    docs: production/styles/cartoon/README.md
    examples: [content/videos/ai-buys-work-knowledge/README.md]

  - id: language-variants
    kind: method
    stage: write
    title: Language variants
    what: Sibling ru.reel.yaml and en.reel.yaml share facts, theme and assets; each is written for its audience, not translated word for word.
    when: One piece for Russian and English audiences.
    status: stable
    docs: docs/how-to/language-variants.md
    examples: [examples/ai-jobs/README.md]

  - id: brand-and-series
    kind: tool
    stage: write
    title: Brand profile and series
    what: Audience, voices, the disclosure every post must carry and avoided phrases (checked by QA); series list episodes of a rubric with their status.
    when: Pieces for a channel or a recurring rubric.
    commands: [series]
    how: "brand: ../../brand.yaml in the reel; npm run storygro -- series content/series/<id>.yaml"
    status: stable
    docs: docs/how-to/brand-and-series.md
    examples: [content/brand.yaml, content/series/business-explainers.yaml]

  - id: style-cartoon
    kind: style
    stage: look
    title: Cartoon explainer
    what: Generated comic illustrations with a recurring cast, a new picture every 4–8 s with a slow camera move, burned-in captions, headlines and sourced numbers drawn on top. 16:9 by default.
    when: Narrated explainers for YouTube, from a one-minute short to a long-form episode; stories about people and decisions.
    commands: [styles, new, images]
    how: npm run storygro -- new content/videos/<id> --style cartoon
    status: pilot
    style: cartoon
    docs: docs/tutorials/cartoon-explainer.md
    examples: [content/videos/ai-buys-work-knowledge/README.md]

  - id: style-cut-paper
    kind: style
    stage: look
    title: Cut-paper explainer
    what: Vertical explainers on paper — hand-cut cards, paper figures, marker strokes, stamps — one mechanism per scene. No pictures to generate.
    when: Reels and Shorts, 45–90 s, a mechanism with recurring objects and two or three numbers.
    commands: [new]
    how: npm run storygro -- new content/videos/<id> --style cut-paper
    status: stable
    style: cut-paper
    docs: docs/how-to/use-a-style.md
    examples: [examples/ai-jobs/README.md, content/videos/ai-agent-checks/README.md]

  - id: style-editorial-collage
    kind: style
    stage: look
    title: Editorial collage
    what: Vertical explainers on graph paper with photo or illustration cut-outs, torn labels, panels and arrows; objects return across scenes.
    when: News-driven explainers with characters and documents; you supply the cut-outs.
    commands: [new]
    how: npm run storygro -- new content/videos/<id> --style editorial-collage
    status: stable
    style: editorial-collage
    docs: docs/how-to/use-a-style.md
    examples: [content/videos/micro1-work-data/README.md]

  - id: scenes-cut-paper
    kind: scenes
    stage: look
    title: Cut-paper scenes
    what: Vertical-first scenes on paper with figures, cards and marker.
    when: The cut-paper style or any paper explainer.
    scenes: [headline, crowd, task-stack, ladder, stat, chart, steps, outro]
    status: stable
    docs: docs/reference/scenes.md

  - id: style-kinetic-type
    kind: style
    stage: look
    title: Kinetic typography
    what: Vertical shorts made of words — each word lands on a spring when it is spoken, one accent bar travels between lines with the beat — plus a timeline, a process and a comparison of sizes drawn in the same type. No pictures to generate.
    when: Reels, Shorts and Telegram, 15–45 s — a thesis, a quote, a mechanism in a few steps.
    commands: [new]
    how: npm run storygro -- new content/videos/<id> --style kinetic-type
    status: pilot
    style: kinetic-type
    docs: production/styles/kinetic-type/README.md

  - id: scenes-kinetic
    kind: scenes
    stage: look
    title: Kinetic and diagram scenes
    what: Words that land as they are spoken (kinetic), an axis that lights up node by node (timeline), an isometric flow with a travelling token (process) and areas proportional to values with a camera that pulls back (scale).
    when: The kinetic-type style, or a typographic beat inside another reel; theme tokens fall back to cut-paper.
    scenes: [kinetic, timeline, process, scale]
    status: pilot
    docs: docs/reference/scenes.md#kinetic

  - id: motion-kit
    kind: method
    stage: look
    title: Springs, beat grid and motion blur
    what: Closed-form springs (spring, springs) instead of linear moves, the music's beat grid in every scene (ctx.beats) and on sound effects (snap), and motion blur from sub-frames (format.blur).
    when: Any new scene or reel that should move like a motion designer's work; principles from the reference notes.
    how: 'kit.spring(t, t0, { from, to }); sfx: { at: cue, kind: pop, snap: beat }; format: { blur: 4 }'
    status: pilot
    docs: docs/reference/scene-contract.md#motion
    examples: [content/research/references/awesome-opus5-5-videos.md]

  - id: scenes-collage
    kind: scenes
    stage: look
    title: Collage scene
    what: One layered scene — text, labels, image cut-outs, panels, arrows — composed per beat.
    when: The editorial-collage style.
    scenes: [collage]
    status: stable
    docs: docs/reference/scenes.md#collage

  - id: scenes-illustration
    kind: scenes
    stage: look
    title: Illustration scene
    what: Full-frame pictures that change on cues with a camera move, split frames, and DOM overlays (headline band, scalable number badge, labels fitted into the safe area, source line, and an optional compact portrait fact card).
    when: The cartoon style or any piece built from pictures.
    scenes: [illustration]
    status: pilot
    docs: docs/reference/scenes.md#illustration

  - id: football-series-retention
    kind: method
    stage: look
    title: Illustrated series identity and retention pilot
    what: Shared first-frame identity with episode-specific researched art, immediate narration, a factual curiosity hook, narrative image changes, a resolved opening question and an empathetic viewer question.
    when: An illustrated recurring series; episode 6 is the owner-authorised retention experiment, not measured uplift.
    status: pilot
    docs: docs/how-to/football-series.md
    examples: [content/videos/football-legends-06-masopust/README.md]

  - id: reels-learning-loop
    kind: method
    stage: write
    title: Reels story direction and measured experiments
    what: Viewer promise, opening alternatives, early result, causal beats and payoff in DIRECTION.md; one-factor pilots with the exact published revision, comparable ages and distribution modes. Manual metrics separate missing values and calculate watch ratio and events per reach without inferring completion or causality.
    when: Required for new or deliberately remade Reels under the owner-adopted workflow of 2026-10-31; the next Football Legends episode uses FL-R1. Audience effects remain pilot hypotheses.
    status: pilot
    docs: docs/how-to/reels-retention.md
    examples: [content/research/reels-growth-2026-10-31/README.md]

  - id: scenes-series-cover
    kind: scenes
    stage: look
    title: Series opening cover
    what: A readable project and series identity with an optional emblem over full-frame episode-specific art, visible from frame zero and composed inside the central preview square.
    when: A recurring illustrated series needs a recognisable opening and distinct episode settings.
    scenes: [series-cover]
    status: pilot
    docs: docs/reference/scenes.md#series-cover

  - id: scenes-archive-photo
    kind: scenes
    stage: look
    title: Dated authentic photo card
    what: An authentic photograph with data-bound story title and concise photo date over a full-frame background. Optional explicit credit is omitted in children's episodes; full provenance stays in the post and documentation. Contain preserves the photo; a declared portrait crop can improve recognition. Deterministic seeking; no AI retouch.
    when: Football Legends or another factual series includes a rights-checked real player or venue photo alongside generated illustrations. A later photo is visibly dated as later.
    scenes: [archive-photo]
    status: pilot
    docs: docs/reference/scenes.md#archive-photo
    examples: [content/videos/football-legends-09-eusebio/DIRECTION.md]

  - id: scenes-photo-pair
    kind: scenes
    stage: look
    title: Authentic photo pair with optional series identity
    what: Two original photographs and data-bound short labels over full-frame artwork. Can reuse the existing series-cover identity and cue-driven reveal; original faces are never generatively retouched.
    when: A paired football story needs actual player likenesses with fictional hosts supporting nearby; compose hosts below the photo cards and retain full provenance outside the children's frame.
    scenes: [photo-pair]
    status: pilot
    docs: docs/reference/scenes.md#photo-pair
    examples: [content/videos/football-now-01-messi-ronaldo/DIRECTION.md]

  - id: scenes-photo-focus
    kind: scenes
    stage: look
    title: Player-led authentic photo sequence
    what: Cue-driven original photographs and short dated labels over a full-frame background; optional simple animated pass diagram sits beside the photograph. Data-bound titles stay above the photo and supporting hosts.
    when: A factual sports story needs the real player as the main subject and an illustrative passing mechanism without generative face editing or a claimed match reconstruction.
    scenes: [photo-focus]
    status: pilot
    docs: docs/reference/scenes.md#photo-focus
    examples: [content/videos/football-now-02-madrid-playmakers/DIRECTION.md]

  - id: scenes-screencast
    kind: scenes
    stage: look
    title: Screencast scene
    what: A recorded website inside a phone with the finger, tap ripples, notes and a magnifier, a tap aligned to a narrated word.
    when: Product demos on a real site.
    scenes: [screencast]
    status: stable
    docs: docs/how-to/product-demo-from-a-website.md

  - id: scenes-landscape-product
    kind: scenes
    stage: look
    title: Landscape product scenes
    what: 16:9 scenes from the SlideCraft launch film — statements, a logo reveal, a chat, stacks, grids, a spotlight, pins, an end card.
    when: Product launches and landscape explainers.
    scenes: [statement, logo-reveal, chat, stack, grid, spotlight, pins, end-card]
    status: stable
    docs: docs/reference/scenes.md
    examples: [examples/slidecraft-launch/README.md]

  - id: generated-illustrations
    kind: tool
    stage: look
    title: Generated illustrations
    what: Pictures for shots with a prompt, generated locally with a stable seed; images.json records prompt, seed, model, licence and checksum; the pictures stay out of Git.
    when: Illustrated styles; regenerate a shot by editing its prompt or seed.
    commands: [images]
    how: npm run storygro -- images content/videos/<id>/en.reel.yaml [--dry-run] [--only <scene>]
    status: pilot
    docs: docs/tutorials/cartoon-explainer.md
    examples: [content/videos/ai-buys-work-knowledge/images.json]

  - id: z-image-turbo
    kind: provider
    stage: look
    title: Z-Image-Turbo via mflux
    what: Local image model (Apache-2.0, 8-bit mflux conversion) on Apple silicon, in a separate ~/.storygro/image-venv; about 52 s per 1280×720 picture on an M5 Pro.
    when: Generated illustrations; elsewhere use the manual provider.
    how: npm run setup:images
    status: pilot
    docs: docs/explanation/technology.md

  - id: kids-list-cartoon
    kind: method
    stage: write
    title: Children's list cartoon
    what: Hosts promise a collection, chapter cards group the list, one card per person with one checked cheerful fact, a progress rail of dots, a closing question for a parent; about two minutes.
    when: A children's video about several real people (footballers, scientists); the owner's kids-football series.
    how: Follow docs/how-to/kids-list-cartoon.md; start from content/videos/football-stars-kids
    status: pilot
    docs: docs/how-to/kids-list-cartoon.md
    examples: [content/videos/football-stars-kids/README.md, content/series/kids-football.yaml]

  - id: recognisable-caricatures
    kind: method
    stage: look
    title: Recognisable caricatures, overlays off faces
    what: Name the person and one or two visible traits in each prompt, plain kits without crests, a childhood fact drawn as the person as a child; then place each headline, badge and label per shot so no face is covered, and check every frame.
    when: Pictures of real public people that children should recognise; with the codex provider.
    how: 'prompt: a friendly recognisable caricature of <name>, <traits>, <action>; badge: { y: 0.04, side: left }; title: surname only'
    status: pilot
    docs: docs/how-to/kids-list-cartoon.md#pictures-that-children-recognise
    examples: [content/videos/football-stars-kids/ru.reel.yaml]

  - id: gpt-image-codex
    kind: provider
    stage: look
    title: GPT Image through the Codex CLI
    what: Pictures from the Codex CLI's image tool (images.provider codex, images.model gpt-6-astra), in batches of five, three sessions at a time, scaled and centre-cropped to the reel's size; recorded in images.json as not reproducible by seed.
    when: When a piece needs drawing-like, detailed pictures or recognisable caricatures of public people; compared with Z-Image on 24 Oct 2026 it won on both. Needs a signed-in Codex and the network.
    how: 'images: { provider: codex, model: gpt-6-astra } in the reel, then npm run storygro -- images <spec>'
    status: pilot
    docs: docs/reference/styles.md#in-the-reel
    examples: [content/videos/football-stars-kids/README.md]

  - id: recurring-cast
    kind: method
    stage: look
    title: Recurring cast
    what: Describe each character once (images.cast) and use @name in every prompt; review the storyboard for drift and regenerate with another seed.
    when: Any piece with generated characters.
    status: pilot
    docs: docs/reference/styles.md
    examples: [content/videos/ai-buys-work-knowledge/en.reel.yaml]

  - id: cast-reference-pictures
    kind: method
    stage: look
    title: Reference pictures of recurring hosts
    what: Generate the hosts' faces and a full-height sheet once, have the owner approve them, keep them beside the series with a provenance ledger, and attach them to every shot that names the hosts (images.refs); the codex provider passes them to GPT Image, so the hosts look the same in every shot and every episode.
    when: A series with recurring characters drawn by GPT Image; text descriptions alone let the generator redraw them each time.
    how: 'images: { provider: codex, refs: { matvey: [../../series/<id>/cast/matvey-face.png, ../../series/<id>/cast/hosts-full.png] } }'
    status: pilot
    docs: docs/reference/styles.md#in-the-reel
    examples: [content/series/football-legends.md, content/videos/football-legends-01-matthews/ru.reel.yaml]

  - id: text-free-pictures
    kind: method
    stage: look
    title: No text in pictures
    what: Prompts forbid text; headlines, numbers and labels are overlays bound to facts, so they are sharp, translatable and traceable. Pictures with stray letters are regenerated.
    when: Every generated picture.
    status: pilot
    docs: production/styles/cartoon/README.md

  - id: screen-capture
    kind: tool
    stage: look
    title: Screen capture
    what: A scripted phone-browser session (goto, scroll, tap, type, key) recorded in virtual time with the finger path.
    when: Showing a real product or website.
    commands: [capture]
    how: npm run storygro -- capture content/videos/<id>/captures/<name>.capture.yaml
    status: stable
    docs: docs/how-to/product-demo-from-a-website.md
    examples: [content/videos/slidecraft-demo/README.md]

  - id: new-scene
    kind: method
    stage: look
    title: A new scene module
    what: A deterministic mount() → draw(t) module when no existing scene and props can show the mechanism.
    when: A new visual mechanism that several pieces will use.
    status: stable
    docs: docs/how-to/add-a-scene.md

  - id: narration
    kind: tool
    stage: voice
    title: Local narration and timing
    what: Narrates each scene (cached), measures it and resolves cues to seconds; providers Kokoro (EN), Kokoro-RU, Qwen3-TTS (Apple silicon), Silero, Chatterbox (optional); Whisper aligns words when a provider has no timings.
    when: As soon as the script exists — before designing pictures.
    commands: [voice]
    how: npm run storygro -- voice content/videos/<id>/en.reel.yaml
    status: stable
    docs: docs/reference/voices.md

  - id: voice-design
    kind: method
    stage: voice
    title: Narrator design
    what: Design a synthetic narrator with Qwen3 VoiceDesign, then clone it per line so every scene has the same voice; choose by listening.
    when: A new channel or language; never clone a real person without written consent.
    how: ~/.storygro/venv/bin/python production/py/design_voice.py <out.wav> --lang en --seed 7 --instruct "…"
    status: stable
    docs: docs/how-to/design-a-voice.md

  - id: pronunciation
    kind: method
    stage: voice
    title: Pronunciation and say-as
    what: "`[written](=spoken)` shows 61% while the voice says the words; `[word](/phonemes/)` fixes Kokoro; `{+1.5}` inserts a pause."
    when: Numbers, abbreviations, names, Russian stress.
    status: stable
    docs: docs/how-to/write-a-script.md

  - id: russian-stress
    kind: method
    stage: voice
    title: Russian stress and homographs
    what: "Mark stress with `+` (зам+ок) or an acute (замо́к); by default RUAccent resolves the listed homographs (замок, стоит, органе …) from the sentence, and each engine gets the marks in the form it reads — an uppercase vowel for Qwen3, an acute for Chatterbox, `+` for Silero. The voice log and the plan list every decision."
    when: Every Russian script; check the plan's stress line and mark what RUAccent cannot know from context.
    status: pilot
    docs: docs/reference/voices.md

  - id: pronunciation-dictionary
    kind: tool
    stage: voice
    title: Pronunciation dictionary and stress lookup
    what: Names and hard words with their stress for every Russian reel (production/voices/lexicon-ru.yaml), applied before synthesis; the plan flags capitalised words nobody checked; a lookup in ru.wikipedia and ru.wiktionary adds them with a quote; checked words are heard by a phoneme model, re-voiced when wrong and checked again in QA.
    when: Before voicing any Russian script with names, places or brands; after the plan shows «Ударение не проверено».
    commands: [stress]
    how: npm run storygro -- stress content/videos/<id>/ru.reel.yaml --lookup --write, read the diff, then storygro voice
    status: pilot
    docs: docs/reference/voices.md#pronunciation-notes-russian
    examples: [production/voices/lexicon-ru.yaml, content/videos/ballon-dor-kids/PLAN.ru.md]

  - id: voice-bench
    kind: tool
    stage: voice
    title: Voice bench
    what: The same lines through every candidate voice, measured the same way — Whisper word error, homograph stress from phonemes, brand names, UTMOS naturalness, words a second, compute time — with a page to listen to every line.
    when: Choosing or adding a voice engine; after changing stress handling.
    how: ~/.storygro/venv/bin/python production/py/voice_bench.py production/voices/bench-ru.yaml --out ~/Downloads/storygro-voice-bench-ru
    status: pilot
    docs: docs/reference/voices.md

  - id: chatterbox
    kind: provider
    stage: voice
    title: Chatterbox Multilingual
    what: Resemble AI's MIT-licensed multilingual voice (Russian among 23 languages) that clones a narrator from a reference clip; separate ~/.storygro/chatterbox-venv; about four seconds of compute per second of speech on an M5 Pro.
    when: A second Russian voice to compare with Qwen3; see the bench results before choosing.
    how: npm run setup:chatterbox
    status: pilot
    docs: docs/reference/voices.md

  - id: omnivoice
    kind: provider
    stage: voice
    title: OmniVoice Russian narrator
    what: Isolated local OmniVoice through PyTorch; owner-selected synthetic B reference at speed 0.90 for new Russian scaffolds. Qwen3 is second choice and OmniVoice A third. Pitch-preserving tempo and Whisper alignment use the common voice pipeline; with the episode's stress set to marks, hand marks reach it as an uppercase vowel, and checked dictionary words get another take while wrong. Model weights are CC-BY-NC.
    when: New Russian episodes within the model terms; existing episodes retain their explicit settings.
    how: npm run setup:omnivoice
    status: pilot
    docs: docs/reference/voices.md

  - id: complete-narration-beats
    kind: method
    stage: voice
    title: Complete narration before scene cuts
    what: Preserve question-answer pairs and conjunction-led clauses as complete narration beats when isolated takes truncate or full-file alignment loses words; change illustrations on cues inside the beat.
    when: A short fragment fails speech QA despite a complete source script.
    how: Retain every word, revoice with the selected narrator, inspect alignment and rerun full-file QA after rendering. Never lower the threshold or remove a word to hide the failure.
    status: pilot
    docs: docs/how-to/football-series.md
    examples: [content/videos/football-legends-07-yashin/VOICE-REVIEW.md]

  - id: score
    kind: tool
    stage: voice
    title: Music and sound effects
    what: Music and effects synthesized from numbers (no samples), ducked under the voice, mixed to −14 LUFS.
    when: Every render; set energy per scene and sfx on cues.
    commands: [score]
    how: npm run storygro -- score content/videos/<id>/en.reel.yaml
    status: stable
    docs: docs/explanation/architecture.md

  - id: stills
    kind: tool
    stage: make
    title: Stills and live preview
    what: PNG frames at seconds, scenes or cues, with platform guides; a live preview with sound.
    when: Designing and debugging scenes; checking every cue.
    commands: [still, preview]
    how: npm run storygro -- still content/videos/<id>/en.reel.yaml hook hook@turn --guides
    status: stable
    docs: docs/how-to/add-a-scene.md

  - id: storyboard-approval
    kind: method
    stage: make
    title: Storyboard and approval
    what: Key frame, narration, on-screen text and warnings per scene; approval stores a hash of every input and any change resets it.
    when: Before every render; the owner approves.
    commands: [board, approve]
    how: npm run storygro -- board <spec>, read board.pdf, then npm run storygro -- approve <spec>
    status: stable
    docs: docs/explanation/quality.md

  - id: plan-and-approvals
    kind: tool
    stage: make
    title: Plan document and stepped approvals
    what: PLAN.<variant>.md with the rendered frame and pictures of every scene, narration, on-screen text, facts and open questions; approvals for script, storyboard and release written to review.yaml in Git with a hash each.
    when: Before rendering, so the owner can read, change and approve the whole episode; again after the cut for the release.
    commands: [plan, approve]
    how: npm run storygro -- plan <spec>; npm run storygro -- approve <spec> --step script|storyboard|release (agents add --agent)
    status: pilot
    docs: docs/how-to/review-and-approve.md
    examples: [content/videos/agents-open-door/PLAN.ru.md]

  - id: episode-tracker
    kind: tool
    stage: ship
    title: Episode tracker
    what: One table across every episode and variant — stage, whose move, the three approvals, length, QA, facts with a source, open questions, publications — with the owner's waiting list on top.
    when: Planning the week; checking what waits for the owner or the agent.
    commands: [tracker]
    how: npm run storygro -- tracker content/videos --md content/TRACKER.md
    status: pilot
    docs: docs/explanation/content-workflow.md

  - id: render
    kind: tool
    stage: make
    title: Render
    what: Headless Chrome draws every frame, ffmpeg encodes master and web MP4, subtitles and stills are written, QA runs.
    when: After approval.
    commands: [render, subs]
    how: npm run storygro -- render content/videos/<id>/en.reel.yaml
    status: stable
    docs: docs/explanation/architecture.md

  - id: formats
    kind: method
    stage: make
    title: Formats, safe areas and captions
    what: 9:16, 4:5, 1:1 and 16:9 presets; safe-area profiles for Reels and Shorts; burned-in captions phrase by phrase.
    when: Choosing the platform shape; keep text clear of the platform UI.
    status: stable
    docs: docs/reference/formats.md

  - id: carousel
    kind: tool
    stage: make
    title: Carousel cards
    what: One 1080×1350 card per scene at its key moment, from a carousel spec with its own copy.
    when: An Instagram carousel alongside the video.
    commands: [carousel]
    how: npm run storygro -- carousel examples/ai-jobs/en.carousel.yaml
    status: stable
    docs: docs/how-to/carousel-and-release.md

  - id: instagram-reels-native
    kind: method
    stage: make
    title: Native full-frame Instagram Reels
    what: Owner-approved 1080×1920 at 30 fps with edge-to-edge backgrounds, safe reels for text, short captions and individual overlay placement. Text and heads stay below the 4:5 feed crop (320 px), the cover inside the 1:1 preview; still --guides draws both, QA checks cover text and writes feed and cover sheets of the MP4. No padding around a shrunken edit. Upload as a Reel keeping Original / 9:16 (UPLOAD.txt), then instagram-check the post.
    when: Every new or remade Instagram Reel, across styles and series.
    commands: [new]
    how: npm run storygro -- new content/videos/<id> --style cartoon --lang ru --target instagram-reels
    status: stable
    docs: docs/how-to/instagram-without-cropping.md
    examples: [content/videos/football-legends-01-matthews/README.md]

  - id: instagram-check
    kind: tool
    stage: ship
    title: Check what Instagram stored
    what: Reads a published post's public embed page and measures the full-size cover frame Instagram stored, which has the stored video's shape; 1080×1920 passes, a square or 4:5 means the upload cropped the Reel. Unofficial page; reports a deleted or private post.
    when: Right after every Instagram upload, and before calling a published Reel cropped or fine.
    commands: [instagram-check]
    how: npm run storygro -- instagram-check https://www.instagram.com/p/<code>/
    status: stable
    docs: docs/how-to/instagram-without-cropping.md#upload

  - id: social-fit
    kind: tool
    stage: ship
    title: Preserve a complete video with padding
    what: Fits an existing master inside Reels UI margins and a square canvas with navy padding, preserving the whole picture and copying AAC audio; verifies full decoding, frame count, size, duration and audio hash in a separate review manifest.
    when: Visible borders are explicitly wanted to preserve every pixel of an existing edit. For native Reels, recompose the scenes full-frame instead.
    commands: [social]
    how: npm run storygro -- social content/videos/<id>/ru.reel.yaml <new-output-dir>
    status: pilot
    docs: docs/how-to/instagram-without-cropping.md
    examples: [content/videos/football-legends-01-matthews/README.md]

  - id: technical-qa
    kind: tool
    stage: check
    title: Technical QA
    what: Codec, size, audio, length, −14 LUFS, frame-0 hook, black frames, scene errors, facts gate, safe areas at every cue, Whisper hearing ≥ 85 % of each scene, brand rules. Skipped is never passed.
    when: Every render (runs automatically); re-run after any fix.
    commands: [qa]
    how: npm run storygro -- qa content/videos/<id>/en.reel.yaml
    status: stable
    docs: docs/explanation/quality.md

  - id: human-review
    kind: method
    stage: check
    title: Human review
    what: Watch and listen on a phone; check claims against sources, character drift, stray text, tone. A QA pass is not editorial approval.
    when: Before any upload.
    status: stable
    docs: docs/explanation/quality.md#the-human-review-that-no-gate-replaces

  - id: release-package
    kind: tool
    stage: ship
    title: Release package
    what: All variants with MP4, subtitles, cover, stills, storyboard PDF, QA report, post text and a manifest with SHA-256, engine commit and voice providers; refuses unapproved or failing inputs.
    when: A piece is ready to hand over or publish.
    commands: [package, deliver]
    how: npm run storygro -- package content/videos/<id>/episode.yaml (deliver <spec> copies one variant to ~/Downloads)
    status: stable
    docs: docs/how-to/carousel-and-release.md

  - id: publication-ledger
    kind: tool
    stage: ship
    title: Publication ledger and metrics
    what: Records manual publication and metric snapshots by source, window and distribution (including 72h); Instagram diagnostics use available same-snapshot operands, never infer completion, and separate trial, organic, paid, mixed and unknown exposure. Uploads nothing.
    when: After a manual upload; to compare results later.
    commands: [publish, metrics]
    how: npm run storygro -- publish plan <release-dir> --variant en --platform youtube --account @handle
    status: stable
    docs: docs/how-to/publish-manually.md

  - id: api-publishing
    kind: provider
    stage: ship
    title: Platform upload and analytics APIs
    what: Uploading to Instagram, YouTube or TikTok and reading their analytics automatically.
    when: Needs the owner's accounts and a decision on the adapter (Postiz or direct APIs).
    status: planned
    docs: ROADMAP.md

  - id: setup
    kind: tool
    stage: maintain
    title: Local environments
    what: The voice, ASR and audio venv (setup, setup:ru) and the separate picture venv (setup:images); off-Git render inputs restored by checksum (assets:fetch).
    when: A new machine or a fresh checkout.
    how: npm run setup:ru && npm run setup:images && npm run assets:fetch
    status: stable
    docs: docs/start-here.md

  - id: repo-checks
    kind: tool
    stage: maintain
    title: Repository checks
    what: Media policy on indexed blobs, doc links and anchors, this toolkit, TypeScript, tests — the same in the pre-commit hook and CI.
    when: Before every commit.
    how: npm run check
    status: stable
    docs: docs/explanation/how-we-work.md

  - id: doc-media
    kind: tool
    stage: maintain
    title: Documentation previews, the toolkit page and the registry
    what: Rebuilds the small English previews in docs/media/ from local renders, each under 300 KiB, docs/reference/toolkit.md from this file, and docs/reference/registry.md — every reel with its scene sequence, every style's story structure, every scene with the reels that use it, the runtime helpers, theme tokens and visual checks.
    when: After rendering something the docs show; after editing this file; after adding a reel, a scene or a style (npm test fails while the registry is stale).
    how: npm run docs:media; npm run docs:toolkit; npm run docs:registry
    status: stable
    docs: docs/adr/0004-docs-structure-and-media.md

  - id: help
    kind: tool
    stage: maintain
    title: CLI help
    what: Every command with its arguments and options.
    commands: [help]
    how: npm run storygro -- help
    status: stable
    docs: docs/reference/cli.md
