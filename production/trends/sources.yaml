trends: 1
# Wikipedia daily tops (RU/EN). Data can arrive late: the nearest available past UTC day is used and reported.
wikipedia: [ru, en]
lookbackDays: 7
hackerNews: true
# Google Trends daily search trends per region. Public RSS feed, not an official API: the format can change.
googleTrends: [RU, US]
limit: 20
# Word stems that mark a signal as relevant to our audience (leaders, founders and specialists adopting AI).
# A rough text filter, not a classifier: always read the item before using it.
focus:
