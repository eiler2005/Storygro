    # bench 24.10.2026: unmarked 4/4 takes right (`z u l`, `z a l`), marked «ЗолотОй» only 2/4; the
    # cartoon said «Зо́лотой» four times out of four. So: no mark, a check, another take when wrong
    mark: false
    check: { right: '[zs] [aɐəʌʊɨɪuei]ː? l', wrong: '[zs] oː? l' }
    source: 'ru.wikipedia, «Золотой»: «…Золото́й — нечто, изготовленное из золота. Также…» (storygro stress --lookup, 2026-10-24)'
