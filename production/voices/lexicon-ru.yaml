# How the Russian narrator says names and hard words, for every reel in every episode.
#
# py/stress.py applies an entry to every Russian line before synthesis (after the author's own marks,
# which always win; before RUAccent's homographs). Engines get the stress in the form they read
# (Qwen3: an uppercase vowel). Adding an entry re-voices only the lines that contain it.
#
#   word    the written form in the script (any case)
#   say     the same word with `+` before the stressed vowel; letters may be respelled
#   forms   other case forms: a list (the stress stays on the same letter as in `say`) or a map
#           form → say for forms whose letters change
#   source  where the stress was checked (a dictionary or an encyclopaedia, quoted) — required
#   check   optional: espeak-IPA patterns (regex) for the right and the wrong reading, from the voice
#           bench. Narration tries another take (up to three) when a checked word comes out wrong,
#           and QA listens for it again in the final voice track.
#   mark    true (default): engines that read dictionary marks well get it (Silero, Chatterbox, Yandex);
#           Qwen3 does not — the owner found it cleaner unmarked (24.10.2026). false: no engine gets it,
#           the stress is only recorded and checked. always: Qwen3 too, where a bench showed it helps
#
# Find words that need an entry: `storygro stress <spec>`; look them up online and add them with
# `storygro stress <spec> --lookup --write` (ru.wikipedia, ru.wiktionary), then read the diff.
lexicon: 1
words:
  - word: Месси
    say: М+есси
    source: 'ru.wikipedia, «Месси, Лионель»: «Лионе́ль Андре́с Ме́сси Куччитти́ни»'
    # bench 24.10.2026, Qwen3 speed 1.12: unmarked 0/3 takes right (`m i s i`, `m i i`), marked 2/3
    # (`m e s i`); the recogniser often drops the сс, so the pattern looks only at the vowel after м
    check: { right: 'm [eɛ]', wrong: 'm [iɪ]' }
    # the one word where the bench showed the mark helps Qwen3 (0/3 → 2/3), so it reaches Qwen3 too
    mark: always
  - word: Лионель
    say: Лион+ель
    forms: [Лионеля, Лионелю, Лионелем, Лионеле]
    # bench 24.10.2026: marked 4/4 takes right (`e a ɲ e l` — the о reduces); the cartoon kept a wrong
    # take (`i o ɲ`, «Лио́неля»), so the word is checked and re-voiced when it comes out wrong
    check: { right: '[ie] [aɐəʌ]ː? ?[nɲ]', wrong: '[ie] [oʊu]ː? ?[nɲ]' }
    source: 'ru.wikipedia, «Месси, Лионель»: «Лионе́ль Андре́с Ме́сси»'
  - word: Платини
    say: Платин+и
    source: 'ru.wikipedia, «Платини, Мишель»: «Мише́ль Франсуа́ Платини́»'
  - word: Кройф
    say: Кр+ойф
    forms: [Кройфа, Кройфу, Кройфом, Кройфе]
    source: 'ru.wikipedia, «Кройф, Йохан»: «Хе́ндрик Йо́ханнес (Йо́хан) Кройф», нидерл. [ˈkrœyf] — один слог'
  - word: Бонмати
    say: Бонмат+и
    source: 'ru.wikipedia, «Бонмати, Айтана»: «Айта́на Бонмати́ Ко́нка»'
  - word: Айтана
    say: Айт+ана
    forms: [Айтаны, Айтане, Айтану, Айтаной]
    source: 'ru.wikipedia, «Бонмати, Айтана»: «Айта́на Бонмати́ Ко́нка»'
  - word: Золотой
    say: Золот+ой
    # bench 24.10.2026: unmarked 4/4 takes right (`z u l`, `z a l`), marked «ЗолотОй» only 2/4; the
    # cartoon said «Зо́лотой» four times out of four. So: no mark, a check, another take when wrong
    mark: false
    check: { right: '[zs] [aɐəʌʊɨɪuei]ː? l', wrong: '[zs] oː? l' }
